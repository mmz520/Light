<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0603">
<title>生存游戏 | 手眼通天沙箱真人秀</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0603;font-family:'Courier New',monospace;color:#c9a961;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none}

/* ============== 开始界面 ============== */
.start{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .6s}
.start.fadeout{opacity:0;pointer-events:none}
.start-logo{font-size:48px;color:#c9a961;letter-spacing:12px;text-shadow:0 0 30px rgba(201,169,97,.4);margin-bottom:8px;font-weight:bold}
.start-sub{font-size:12px;color:#5a4a2a;letter-spacing:6px;margin-bottom:40px;text-transform:uppercase}
.start-num-box{width:200px;height:200px;border:2px solid #8b6914;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(10,6,3,.8);box-shadow:0 0 30px rgba(139,105,20,.4);position:relative;overflow:hidden}
.start-num{font-size:120px;color:#c9a961;font-weight:bold;text-shadow:0 0 20px rgba(201,169,97,.6),0 0 40px rgba(201,169,97,.3);line-height:1}
.start-num-label{position:absolute;bottom:8px;font-size:10px;color:#5a4a2a;letter-spacing:4px;text-transform:uppercase}
.start-story{max-width:500px;text-align:center;font-size:11px;color:#6a5a3a;line-height:1.8;margin-top:40px;padding:0 20px}
.start-enter{margin-top:30px;font-size:11px;color:#8b6914;letter-spacing:3px;animation:pulse 1.5s infinite}
.settings-btn{position:absolute;right:20px;bottom:20px;background:rgba(10,6,3,.7);border:1px solid #5a4a2a;color:#c9a961;padding:8px 14px;font-size:12px;cursor:pointer;font-family:inherit;letter-spacing:2px;border-radius:4px;transition:all .2s}
.settings-btn:hover{background:#8b6914;color:#0a0603}

/* 设置弹窗 */
.settings-modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center}
.settings-modal.open{display:flex}
.settings-box{width:min(520px,92vw);background:#0a0603;border:1px solid #8b6914;padding:24px;border-radius:6px;box-shadow:0 0 40px rgba(139,105,20,.4)}
.settings-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.settings-head span{font-size:18px;color:#c9a961;letter-spacing:6px}
.settings-close{background:transparent;border:1px solid #5a4a2a;color:#c9a961;width:28px;height:28px;cursor:pointer;border-radius:4px}
.settings-sub{font-size:10px;color:#6a5a3a;margin-bottom:18px;letter-spacing:1px}
.settings-list{display:flex;flex-direction:column;gap:12px;margin-bottom:14px;max-height:55vh;overflow:auto;padding-right:4px}
.biome-row{display:flex;align-items:center;gap:10px;font-size:12px}
.biome-row .b-icon{font-size:20px;width:28px;text-align:center}
.biome-row .b-name{width:60px;color:#c9a961}
.biome-row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:#5a4a2a;border-radius:2px;outline:none}
.biome-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;background:#c9a961;border:2px solid #8b6914;border-radius:50%;cursor:pointer}
.biome-row input[type=range]::-moz-range-thumb{width:16px;height:16px;background:#c9a961;border:2px solid #8b6914;border-radius:50%;cursor:pointer}
.biome-row .b-val{width:38px;text-align:right;color:#ffdd66;font-weight:bold}
.settings-bar-total{text-align:right;font-size:11px;color:#5a4a2a;margin-bottom:14px}
.settings-foot{display:flex;justify-content:flex-end;gap:10px}
.btn{background:transparent;border:1px solid #5a4a2a;color:#c9a961;padding:8px 18px;font-size:11px;cursor:pointer;font-family:inherit;letter-spacing:2px;border-radius:4px}
.btn:hover{background:#5a4a2a;color:#0a0603}
.btn-save{background:#8b6914;border-color:#8b6914;color:#0a0603;font-weight:bold}
.btn-save:hover{background:#c9a961;border-color:#c9a961}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ============== 睁眼特效 ============== */
.eye-overlay{position:fixed;inset:0;z-index:95;background:#000;pointer-events:none;transition:none}
.eye-overlay .eye-top,.eye-overlay .eye-bottom{position:absolute;left:0;right:0;height:50%;background:#000;transition:transform 1.2s cubic-bezier(.7,0,.3,1)}
.eye-overlay .eye-top{top:0;transform-origin:top}
.eye-overlay .eye-bottom{bottom:0;transform-origin:bottom}
.eye-overlay.blink .eye-top{transform:scaleY(0)}
.eye-overlay.blink .eye-bottom{transform:scaleY(0)}
.eye-overlay.open .eye-top{transform:scaleY(-.02)}
.eye-overlay.open .eye-bottom{transform:scaleY(.02)}

/* 眩晕白闪 */
.daze-flash{position:fixed;inset:0;z-index:96;background:#fff;pointer-events:none;opacity:0;transition:opacity 1.5s}

/* ============== 胜利界面 ============== */
.victory-screen{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.95);display:none;flex-direction:column;align-items:center;justify-content:center}
.victory-screen.show{display:flex;animation:fadein 1s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.victory-title{font-size:42px;color:#c9a961;text-shadow:0 0 30px rgba(201,169,97,.6);letter-spacing:8px;margin-bottom:20px}
.victory-text{max-width:500px;text-align:center;color:#8b6914;font-size:12px;line-height:2.2;margin-bottom:30px;padding:0 20px}
.victory-stats{color:#c9a961;font-size:12px;margin-bottom:30px;text-align:center;line-height:1.8}
.end-btn{background:linear-gradient(135deg,#5a3a14,#8b6914);border:2px solid #c9a961;color:#1a1208;padding:10px 30px;font-family:inherit;font-size:12px;cursor:pointer;letter-spacing:3px;text-transform:uppercase;font-weight:bold;border-radius:3px}
.end-btn:hover{box-shadow:0 0 20px rgba(201,169,97,.6)}

/* ============== HUD ============== */
.hud-status{position:fixed;top:10px;right:10px;z-index:10;display:flex;flex-direction:column;gap:6px;width:180px;pointer-events:none}
.hud-status .stat{background:linear-gradient(135deg,#1e1610,#120a06);border:1px solid #5a4a2a;padding:4px 8px;box-shadow:inset 0 0 8px rgba(0,0,0,.6)}
.hud-status .stat-row{display:flex;align-items:center;gap:6px;font-size:10px;color:#8b6914;text-transform:uppercase;letter-spacing:2px}
.hud-status .stat-icon{font-size:14px}
.hud-status .stat-bar-wrap{flex:1;height:10px;background:#0a0603;border:1px solid #3a2a1a;margin-top:3px;overflow:hidden;position:relative}
.hud-status .stat-bar{height:100%;transition:width .3s}
.hud-status .stat-text{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:8px;color:#c9a961;text-shadow:1px 1px 0 #000}
.hud-status .hp{background:linear-gradient(90deg,#8b1a1a,#c94a4a)}
.hud-status .food{background:linear-gradient(90deg,#5a3a1a,#c99a4a)}
.hud-status .sanity{background:linear-gradient(90deg,#2a3a6a,#4a7aca)}

.hud-meta{position:fixed;top:10px;left:10px;z-index:10;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.hud-meta .sandbox{background:rgba(10,6,3,.8);border:1px solid #8b6914;padding:5px 12px;font-size:11px;color:#c9a961;letter-spacing:2px}
.hud-meta .sandbox b{color:#ffdd66}
.hud-meta .mem-fragments{background:rgba(10,6,3,.8);border:1px dashed #8b6914;padding:4px 10px;font-size:10px;color:#8b6914}
.hud-meta .mem-fragments b{color:#c9a961}

/* 小地图 */
.minimap{position:fixed;top:110px;left:10px;width:140px;height:140px;background:rgba(10,6,3,.9);border:1px solid #8b6914;z-index:10;pointer-events:none}
.minimap canvas{width:100%;height:100%}

/* 消息日志 */
.msg-log{position:fixed;left:160px;bottom:240px;width:260px;max-height:140px;overflow:hidden;z-index:10;pointer-events:none}
.msg{background:rgba(10,6,3,.85);border-left:2px solid #8b6914;padding:4px 8px;margin-bottom:3px;font-size:10px;color:#c9a961;animation:msgIn .3s}
.msg.warn{border-left-color:#c94a4a;color:#c94a4a}
.msg.mem{border-left-color:#a855f7;color:#d8b4fe}
.msg.success{border-left-color:#4ac94a;color:#4ac94a}
@keyframes msgIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

/* 拾取提示 */
.pickup-flash{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(10,6,3,.9);border:1px solid #ffdd66;padding:10px 20px;color:#ffdd66;font-size:12px;z-index:20;pointer-events:none;animation:pickupShow 2.5s forwards;text-align:center}
@keyframes pickupShow{0%{opacity:0;transform:translate(-50%,-40%)}20%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-60%)}}

/* ============== 底部建造/背包 ============== */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(180deg,rgba(10,6,3,0),rgba(10,6,3,.95) 30%);padding:8px 10px 14px;pointer-events:none}
.bottom-bar .inner{pointer-events:auto;max-width:900px;margin:0 auto}

/* Tab */
.tab-row{display:flex;gap:0;margin-bottom:8px;justify-content:center}
.tab{padding:5px 16px;background:#1a1208;border:1px solid #5a4a2a;border-bottom:none;color:#5a4a2a;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:inherit}
.tab.active{background:#2a1f15;color:#c9a961;border-color:#8b6914}
.tab:hover{color:#c9a961}

/* Panels */
.panel-row{display:flex;gap:10px}
.panel{flex:1;background:#1a1208;border:1px solid #5a4a2a;padding:10px;display:none}
.panel.active{display:block}

/* 建造 tab */
.build-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.build-card{background:#221a12;border:1px solid #5a4a2a;padding:6px;cursor:pointer;transition:all .15s;text-align:center;border-radius:2px}
.build-card:hover{border-color:#c9a961;box-shadow:0 0 10px rgba(201,169,97,.3);transform:translateY(-2px)}
.build-card.selected{border-color:#ffd700;background:#2a2014;box-shadow:0 0 15px rgba(255,215,0,.4)}
.build-card.disabled{opacity:.45;cursor:not-allowed}
.build-icon{font-size:22px;margin-bottom:2px}
.build-name{font-size:9px;color:#c9a961;text-transform:uppercase;letter-spacing:1px}
.build-cost{font-size:8px;color:#8b6914;margin-top:2px;line-height:1.3}

/* 背包 tab */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.inv-card{background:#221a12;border:1px solid #5a4a2a;padding:6px;cursor:pointer;display:flex;align-items:center;gap:6px;border-radius:2px;transition:all .15s;position:relative}
.inv-card:hover{border-color:#c9a961;box-shadow:0 0 10px rgba(201,169,97,.3)}
.inv-icon{font-size:18px}
.inv-info{flex:1;min-width:0}
.inv-name{font-size:9px;color:#c9a961;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-count{font-size:11px;color:#ffdd66;font-weight:bold}
.inv-btn{font-size:8px;background:#3a2f1f;border:1px solid #5a4a2a;color:#c9a961;padding:2px 4px;cursor:pointer;font-family:inherit;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.inv-btn:hover{border-color:#c9a961}

.inv-hint{font-size:9px;color:#8b6914;margin-top:8px;text-align:center;letter-spacing:1px}

/* 引导提示 */
.mem-intro{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);max-width:420px;background:rgba(10,6,3,.95);border:1px solid #8b6914;padding:20px;color:#c9a961;font-size:11px;line-height:2;z-index:15;text-align:center;box-shadow:0 0 30px rgba(139,105,20,.4)}
.mem-intro h3{font-size:14px;color:#ffdd66;margin-bottom:10px;letter-spacing:3px}
.mem-intro .key{color:#a855f7;font-weight:bold}

/* ============== 移动端虚拟摇杆 ============== */
.joystick{position:fixed;left:16px;bottom:16px;width:120px;height:120px;border-radius:50%;background:rgba(42,31,21,.35);border:2px solid #8b6914;z-index:15;display:none;touch-action:none}
.joystick.active{display:block}
.joystick .knob{position:absolute;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,#c9a961,#8b6914);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 10px rgba(201,169,97,.5)}
.mob-btns{position:fixed;right:16px;bottom:120px;display:none;flex-direction:column;gap:10px;z-index:15}
.mob-btns.active{display:flex}
.mob-btn{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#2a1f15,#1a1208);border:2px solid #8b6914;color:#c9a961;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none;box-shadow:0 0 10px rgba(0,0,0,.6)}
.mob-btn:active{background:#3a2f1f;border-color:#ffd700;transform:scale(.95)}

.mob-build-hint{position:fixed;right:16px;bottom:78px;font-size:9px;color:#c9a961;background:rgba(10,6,3,.8);padding:4px 8px;border:1px solid #8b6914;display:none;z-index:15;pointer-events:none;max-width:140px;text-align:center}
.mob-build-hint.active{display:block}

@media (max-width: 768px) {
    .hud-status{width:140px;font-size:9px}
    .hud-status .stat-icon{font-size:12px}
    .minimap{width:100px;height:100px;top:110px}
    .msg-log{left:110px;width:45vw;max-height:100px;bottom:240px}
    .start-logo{font-size:28px;letter-spacing:6px}
    .start-num-box{width:140px;height:140px}
    .start-num{font-size:80px}
    .build-grid{grid-template-columns:repeat(4,1fr)}
    .inv-grid{grid-template-columns:repeat(3,1fr)}
    .panel{padding:6px}
    .inv-hint{display:none}
    .bottom-bar{padding-bottom:60px}
}

@supports (padding:max(0px)){
    .joystick{left:max(16px,env(safe-area-inset-left));bottom:max(16px,calc(env(safe-area-inset-bottom)+60px))}
    .mob-btns{right:max(16px,env(safe-area-inset-right));bottom:max(120px,calc(env(safe-area-inset-bottom)+100px))}
    .bottom-bar{padding-bottom:max(14px,env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<!-- ============ 开始 ============ -->
<div class="start" id="startScreen">
    <div class="start-logo">生存游戏</div>
    <div class="start-sub">SANDBOX REALITY SHOW</div>
    <div class="start-num-box">
        <div class="start-num" id="sandboxNum">—</div>
        <div class="start-num-label">沙箱编号</div>
    </div>
    <div class="start-enter" id="startEnter">点击 / 触屏 进入</div>
    <button class="settings-btn" id="openSettings" title="游戏设置">⚙ 设置</button>
</div>

<!-- 设置弹窗 -->
<div class="settings-modal" id="settingsModal">
    <div class="settings-box">
        <div class="settings-head">
            <span>游戏设置</span>
            <button class="settings-close" id="closeSettings">✕</button>
        </div>
        <div class="settings-sub">各地貌权重（总和自动归一化，默认 = 100）</div>
        <div class="settings-list" id="biomeSliders"></div>
        <div class="settings-bar-total" id="weightTotal">总和：100</div>
        <div class="settings-foot">
            <button class="btn" id="resetBiomes">重置</button>
            <button class="btn btn-save" id="applyBiomes">应用</button>
        </div>
    </div>
</div>

<!-- ============ 睁眼特效 ============ -->
<div class="eye-overlay" id="eyeOverlay"><div class="eye-top"></div><div class="eye-bottom"></div></div>
<div class="daze-flash" id="dazeFlash"></div>

<!-- ============ HUD ============ -->
<div class="hud-status">
    <div class="stat">
        <div class="stat-row"><span class="stat-icon">❤</span>生命值</div>
        <div class="stat-bar-wrap"><div class="stat-bar hp" id="hpBar" style="width:100%"></div><span class="stat-text" id="hpTxt">100</span></div>
    </div>
    <div class="stat">
        <div class="stat-row"><span class="stat-icon">🍖</span>饱腹度</div>
        <div class="stat-bar-wrap"><div class="stat-bar food" id="foodBar" style="width:100%"></div><span class="stat-text" id="foodTxt">100</span></div>
    </div>
    <div class="stat">
        <div class="stat-row"><span class="stat-icon">🧠</span>精神状况</div>
        <div class="stat-bar-wrap"><div class="stat-bar sanity" id="sanBar" style="width:100%"></div><span class="stat-text" id="sanTxt">100</span></div>
    </div>
</div>

<div class="hud-meta">
    <div class="sandbox">沙箱 <b id="sandboxHud">—</b></div>
    <div class="mem-fragments">记忆碎片 <b id="memCount">0 / 5</b></div>
</div>

<canvas class="minimap" id="minimap" width="140" height="140"></canvas>
<div class="msg-log" id="msgLog"></div>

<!-- ============ 底部 ============ -->
<div class="bottom-bar">
    <div class="inner">
        <div class="tab-row">
            <div class="tab active" data-tab="tools">🛠 工具</div>
            <div class="tab" data-tab="build">🏚 建筑</div>
            <div class="tab" data-tab="inv">🎒 背包</div>
        </div>
        <div class="panel active" data-panel="tools">
            <div class="build-grid" id="toolsGrid"></div>
        </div>
        <div class="panel" data-panel="build">
            <div class="build-grid" id="buildGrid"></div>
        </div>
        <div class="panel" data-panel="inv">
            <div class="inv-grid" id="invGrid"></div>
            <div class="inv-hint">点击物品使用</div>
        </div>
    </div>
</div>

<!-- 移动端 -->
<div class="joystick" id="joystick"><div class="knob"></div></div>
<div class="mob-btns" id="mobBtns">
    <div class="mob-btn" id="btnAttack">⚔</div>
    <div class="mob-btn" id="btnPlace">📍</div>
</div>
<div class="mob-build-hint" id="mobHint"></div>

<!-- 胜利 -->
<div class="victory-screen" id="vicScreen">
    <div class="victory-title">出口在脑海中显现</div>
    <div class="victory-text">
        记忆的碎片被你一片一片拾起，<br>
        画面开始重新连接成完整的过去——<br><br>
        你记起了自己是谁，为什么会在这里。<br>
        沙箱的边界裂开一道缝，<br>
        外面，是真实的世界。<br><br>
        工作人员的声音在广播里响起：<br>
        「恭喜，你找到了出口。」
    </div>
    <div class="victory-stats" id="vicStats"></div>
    <button class="end-btn" onclick="location.reload()">重启记忆</button>
</div>

<script type="module">
import * as THREE from 'three';

// ================== 配置 ==================
const CFG = {
    MAP: 50, CELL: 2,
    DAY_LEN: 150,
    PLAYER_SPEED: 6,
    SPAWN_INTERVAL: 7,
    SPAWN_RADIUS: 14,
    AUTO_PICKUP_RANGE: 5,
    BUILD_EXCLUDE_RADIUS: 5,
    FRAGMENT_SPAWN_CHANCE: 0.04,
    VICTORY_FRAGMENTS: 5
};

// ===== 地貌权重（设置页可改，和为 100） =====
const BIOMES = {
    grassland:{ name:'草原',  icon:'🌿', color:0x3a5530, dark:0x2a4025, height:.35, buildable:true, weights:30 },
    desert:   { name:'沙漠',  icon:'🏜', color:0x8a6a38, dark:0x6a5028, height:.15, buildable:true, weights:18 },
    forest:   { name:'森林',  icon:'🌲', color:0x1f3a1f, dark:0x152815, height:.50, buildable:true, weights:22 },
    ocean:    { name:'海洋',  icon:'🌊', color:0x1a3a5a, dark:0x0e2a42, height:-.6, buildable:false, weights:12 },
    snow:     { name:'雪原',  icon:'❄️', color:0xd8e4ec, dark:0xa8b4bc, height:.55, buildable:true, weights:10 },
    gobi:     { name:'戈壁',  icon:'🪨', color:0x5a5248, dark:0x3a3228, height:.30, buildable:true, weights:8  }
};
let BIOME_ORDER = Object.keys(BIOMES); // 保持插入顺序

// 稀有度
const RARITY = {
    common:   { color:0x888888, name:'常见', weight:45 },
    uncommon: { color:0x4ac94a, name:'少见', weight:30 },

// ================== 设置面板 ==================
function settingsInit() {
    const modal = document.getElementById('settingsModal');
    const list = document.getElementById('biomeSliders');
    const totalEl = document.getElementById('weightTotal');

    function render() {
        list.innerHTML = '';
        BIOME_ORDER.forEach(k => {
            const B = BIOMES[k];
            const row = document.createElement('div');
            row.className = 'biome-row';
            row.innerHTML = `
                <span class="b-icon">${B.icon}</span>
                <span class="b-name">${B.name}</span>
                <input type="range" min="0" max="100" value="${B.weights}" data-k="${k}">
                <span class="b-val" id="val-${k}">${B.weights}</span>`;
            list.appendChild(row);
        });
        updateTotal();
    }
    function updateTotal() {
        let t = 0;
        BIOME_ORDER.forEach(k => t += BIOMES[k].weights);
        totalEl.textContent = `总和：${t}` + (t===100 ? '' : '（将自动归一化）');
    }

    list.addEventListener('input', e => {
        const k = e.target.dataset.k;
        if (!k) return;
        let v = parseInt(e.target.value) || 0;
        v = Math.max(0, Math.min(100, v));
        BIOMES[k].weights = v;
        document.getElementById('val-'+k).textContent = v;
        updateTotal();
    });

    document.getElementById('openSettings').addEventListener('click', e => {
        e.stopPropagation();
        modal.classList.add('open');
    });
    document.getElementById('closeSettings').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
    document.getElementById('resetBiomes').addEventListener('click', () => {
        // 重置默认权重
        BIOMES.grassland.weights = 30; BIOMES.desert.weights = 18;
        BIOMES.forest.weights = 22;   BIOMES.ocean.weights = 12;
        BIOMES.snow.weights = 10;     BIOMES.gobi.weights = 8;
        render();
    });
    document.getElementById('applyBiomes').addEventListener('click', () => {
        modal.classList.remove('open');
    });

    render();
}

// ================== 开始动画 ==================
function rollStartSequence() {
    const numEl = document.getElementById('sandboxNum');

    // 点击/触屏进入 → 沙箱号码滚动 → 地图实际生成 → 睁眼特效 → 进入游戏
    const start = (e) => {
        if (gameState !== 'start') return;
        // 不要拦截 settings 弹窗
        if (e && e.target && e.target.closest('#settingsModal')) return;

        gameState = 'opening';
        numEl.style.color = '#c9a961';
        const startScreen = document.getElementById('startScreen');
        startScreen.classList.add('fadeout');
        startScreen.style.pointerEvents = 'none';

        // 显示"生成中..."
        let count = 0;
        let built = false;
        const iv = setInterval(() => {
            sandboxId = Math.floor(Math.random()*100);
            numEl.textContent = sandboxId;
            count++;
            if (count === 15 && !built) {
                built = true;
                rebuildWorldNow(); // ← 地图在滚动中生成
            }
            if (count >= 35) {
                clearInterval(iv);
                numEl.textContent = sandboxId;
                numEl.style.color = '#ffdd66';
                setTimeout(() => startOpening(), 400);
            }
        }, 45);
    };
    // 更稳健：绑在 startScreen 自身上 + 全局兜底
    const sc = document.getElementById('startScreen');
    sc.addEventListener('click', start);
    sc.addEventListener('touchstart', start, { passive:true });
    document.addEventListener('keydown', e => { if (e.code === 'Enter' || e.code === 'Space') start(); });
}

    threats.forEach(t => { if (t.mesh) scene.remove(t.mesh); }); threats = [];
    drops.forEach(d => { scene.remove(d); }); drops = [];
    fragments.forEach(f => { scene.remove(f); }); fragments = [];

// ================== 世界 ==================
function buildWorld() {
    // 清空旧地形（支持重建）
    const old = scene.getObjectByName('terrain');
    if (old) scene.remove(old);
    // 清旧建筑/投放/威胁
    scene.traverse(o => {
        if (o.userData.build || o.userData.isDrop || o.userData.isThreat || o.userData.isPlayer) return;
    });
    cells = [];
    const tg = new THREE.Group(); tg.name = 'terrain'; scene.add(tg);

    // —— 1. 归一化生物群落权重 ——
    const totalW = BIOME_ORDER.reduce((s,k)=>s+BIOMES[k].weights, 0) || 1;
    const cum = {}; let acc = 0;
    BIOME_ORDER.forEach(k => { acc += BIOMES[k].weights/totalW; cum[k] = acc; });

    // —— 2. 生成噪声图（两层，有空间连续性） ——
    const noise1 = [], noise2 = [];
    for (let x=0;x<mapSize;x++) {
        noise1[x]=[]; noise2[x]=[];
        for (let z=0;z<mapSize;z++) {
            const nx=x/mapSize, nz=z/mapSize;
            // 低频大尺度噪声：决定大洲/海洋轮廓
            noise1[x][z] = Math.sin(nx*6+1.3)*Math.cos(nz*6+2.7)
                          + Math.sin(nx*3.3+nz*1.7)*.7
                          + Math.cos(nx*1.7+nz*2.3)*.5
                          + (Math.random()-.5)*.3;
            // 高频小尺度噪声：局部扰动
            noise2[x][z] = Math.sin(nx*16)*Math.cos(nz*16)*.3
                          + Math.sin(nx*8.7+nz*5.3)*.2
                          + (Math.random()-.5)*.4;
        }
    }

    // —— 3. 根据噪声+权重分配生物群落 ——
    for (let x=0; x<mapSize; x++) {
        cells[x] = [];
        for (let z=0; z<mapSize; z++) {
            const dc = Math.sqrt((x-mapSize/2)**2+(z-mapSize/2)**2);
            // 组合噪声 → [0,1] 范围内的值作为"生物群落索引"
            const nRaw = noise1[x][z]*0.75 + noise2[x][z]*0.25; // 范围约 [-1.5,1.5]
            const nIdx = (nRaw + 1.5) / 3; // 归一到 [0,1]

            let biome = 'grassland';
            // 中心出生点保底（海洋权重很高时也不让出生在海里）
            if (dc > 3) {
                for (const k of BIOME_ORDER) {
                    if (nIdx <= cum[k]) { biome = k; break; }
                }
            } else {
                biome = 'grassland'; // 中心强制草原
            }

            const B = BIOMES[biome];
            let h = B.height + (noise2[x][z]*0.15); // 微扰动
            h = Math.max(-.8, h);

            const geo = new THREE.BoxGeometry(cellSize, Math.max(.15, h+0.8), cellSize);
            // 根据噪声微调到邻近色
            const base = B.color;
            const tint = B.dark;
            const t = Math.max(0, Math.min(1, (noise1[x][z]+noise2[x][z])*0.5+0.5));
            const col = lerpColor(tint, base, t);
            const mat = new THREE.MeshLambertMaterial({ color: col });
            const m = new THREE.Mesh(geo, mat);
            m.position.set(
                x*cellSize - mapSize*cellSize/2,
                h/2,
                z*cellSize - mapSize*cellSize/2
            );
            m.receiveShadow = true;
            tg.add(m);

            cells[x][z] = {
                x, z,
                wx: m.position.x, wz: m.position.z,
                biome: biome,
                terrain: biome,
                height: h,
                mesh: m,
                revealed: false, lit: false,
                building: null, drop: null, fragment: null,
                buildable: B.buildable
            };
        }
    }

    // 玩家出生点：找中心附近最近的可建造格子
    const cx = Math.floor(mapSize/2), cz = Math.floor(mapSize/2);
    let spawn = { x:cx, z:cz };
    for (let r=0; r<8; r++) {
        let found = false;
        for (let dx=-r;dx<=r&&!found;dx++)
        for (let dz=-r;dz<=r&&!found;dz++) {
            const xx = cx+dx, zz = cz+dz;
            if (xx>=0&&xx<mapSize&&zz>=0&&zz<mapSize && cells[xx][zz].buildable) {
                spawn = {x:xx, z:zz}; found = true;
            }
        }
        if (found) break;
    }
    cells._spawn = spawn;

    // 迷雾
    const fogC = document.createElement('canvas'); fogC.width=256; fogC.height=256;
    const fogX = fogC.getContext('2d'); fogX.fillStyle='#000'; fogX.fillRect(0,0,256,256);
    const fogT = new THREE.CanvasTexture(fogC);
    const fogM = new THREE.MeshBasicMaterial({ map:fogT, transparent:true, depthWrite:false, side:THREE.DoubleSide });
    const fogG = new THREE.PlaneGeometry(mapSize*cellSize+4, mapSize*cellSize+4);
    const fog = new THREE.Mesh(fogG, fogM); fog.rotation.x = -Math.PI/2; fog.position.y = 5;
    scene.add(fog);
    scene.userData.fogX = fogX;
    scene.userData.fogT = fogT;
}

// 颜色插值（hex → 过渡 → hex）
function lerpColor(c1, c2, t) {
    const r1=(c1>>16)&0xff, g1=(c1>>8)&0xff, b1=c1&0xff;
    const r2=(c2>>16)&0xff, g2=(c2>>8)&0xff, b2=c2&0xff;
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    return (r<<16)|(g<<8)|b;
}

function updateFog() {
    const ctx = scene.userData.fogX;
    const ws = mapSize*cellSize, sc = 256/ws;
    // 全黑遮罩（alpha=1 → 完全盖住未探索区域）
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.fillRect(0,0,256,256);
    // 已探索：用 destination-out 擦掉 alpha，再按状态叠色
    for (let x=0;x<mapSize;x++) for (let z=0;z<mapSize;z++) {
        const c = cells[x][z];
        if (c.lit || c.revealed) {
            const cx = (c.wx + ws/2)*sc, cy = (c.wz + ws/2)*sc;
            const sz = cellSize*sc+2;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillRect(cx-1, cy-1, sz, sz);
            if (!c.lit) {
                // 已探索未点亮 → 叠半透明暗灰（看得见但阴森）
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = 'rgba(40,35,30,0.55)';
                ctx.fillRect(cx-1, cy-1, sz, sz);
            }
        }
    }
    scene.userData.fogT.needsUpdate = true;
}

function revealArea(pos, r) {
    const px = mapSize/2 + pos.x/cellSize;
    const pz = mapSize/2 + pos.z/cellSize;
    for (let x=Math.max(0,Math.floor(px-r));x<Math.min(mapSize,Math.ceil(px+r));x++)
    for (let z=Math.max(0,Math.floor(pz-r));z<Math.min(mapSize,Math.ceil(pz+r));z++) {
        const dx=x-px, dz=z-pz;
        if (dx*dx+dz*dz<r*r) cells[x][z].revealed=true;
    }
}

function updateLighting() {
    for (let x=0;x<mapSize;x++) for (let z=0;z<mapSize;z++) cells[x][z].lit=false;
    const lights = [{x:playerData.pos.x, z:playerData.pos.z, r:5}];
    scene.traverse(o => {
        if (o.userData.build && o.userData.bm) {
            const bm = o.userData.bm;
            if (bm.light > 0 && !bm.destroyed) lights.push({x:o.position.x, z:o.position.z, r:bm.light});
        }
    });
    for (const L of lights) {
        const lx=mapSize/2+L.x/cellSize, lz=mapSize/2+L.z/cellSize;
        for (let x=Math.max(0,Math.floor(lx-L.r));x<Math.min(mapSize,Math.ceil(lx+L.r));x++)
        for (let z=Math.max(0,Math.floor(lz-L.r));z<Math.min(mapSize,Math.ceil(lz+L.r));z++) {
            const dx=x-lx, dz=z-lz;
            if (Math.sqrt(dx*dx+dz*dz)<L.r/cellSize){ cells[x][z].lit=true; cells[x][z].revealed=true; }
        }
    }
    updateFog();
}

function getCell(wx,wz) {
    const x=Math.floor(mapSize/2+wx/cellSize), z=Math.floor(mapSize/2+wz/cellSize);
    if (x<0||x>=mapSize||z<0||z>=mapSize) return null;
    return cells[x][z];
}

// ================== 玩家 ==================
function createPlayer() {
    playerGroup = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(.4,.5,1.1,8), new THREE.MeshLambertMaterial({color:0x3a2a1a}));
    body.position.y=.55; body.castShadow=true; playerGroup.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5), new THREE.MeshLambertMaterial({color:0x8a7a5a}));
    head.position.y=1.4; head.castShadow=true; playerGroup.add(head);
    const hat = new THREE.Mesh(new THREE.ConeGeometry(.35,.4,8), new THREE.MeshLambertMaterial({color:0x1a1a1a}));
    hat.position.y=1.85; playerGroup.add(hat);

function createCampfire() {
    // 玩家旁 4 单位处放初始篝火（沿玩家面朝方向偏移）
    const px = playerData.pos.x, pz = playerData.pos.z;
    const sp = cells._spawn || {x:Math.floor(mapSize/2), z:Math.floor(mapSize/2)};
    const spawnCenter = new THREE.Vector3(cells[sp.x][sp.z].wx, cells[sp.x][sp.z].height, cells[sp.x][sp.z].wz);
    // 偏移到 spawnCenter + (4,0,0) 且找到可建造格
    const tryPositions = [
        new THREE.Vector3(spawnCenter.x + 4, spawnCenter.y, spawnCenter.z),
        new THREE.Vector3(spawnCenter.x + 2, spawnCenter.y, spawnCenter.z + 3),
        new THREE.Vector3(spawnCenter.x - 2, spawnCenter.y, spawnCenter.z + 3),
        spawnCenter
    ];
    let pos = null;
    for (const tp of tryPositions) {
        const cell = getCell(tp.x, tp.z);
        if (cell && cell.buildable) { pos = new THREE.Vector3(tp.x, cell.height, tp.z); break; }
    }
    if (pos) {
        playerData.inv.wood += 3;
        playerData.inv.stone += 2;
        buildStructure('campfire', pos, true);
    }
}

// ================== 建造 ==================
function buildStructure(type, pos, instant=false) {
    const def = BUILDINGS[type];
    const cell = getCell(pos.x, pos.z);
    if (!cell) return null;
    if (!cell.buildable) return null;
    if (cell.building) return null;

    const b = new THREE.Group();
    b.userData.build = true;
    b.userData.bm = { ...def, hp:def.hp, maxHp:def.hp, type, destroyed:false, atkTimer:0 };

    // 通用材质
    const M = { metal: new THREE.MeshLambertMaterial({color:0x4a4a4a,metalness:.6}),
                wood:  new THREE.MeshLambertMaterial({color:0x5a3a20}),
                stone: new THREE.MeshLambertMaterial({color:0x6a6a6a}),
                brass: new THREE.MeshLambertMaterial({color:0x8a6a3a,metalness:.5}) };

    switch(type){
    case 'campfire':{
        const logs = new THREE.Group();
        for(let i=0;i<3;i++){
            const l = new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.9,6), M.wood);
            l.rotation.z = (i/3)*Math.PI*2 + .3;
            logs.add(l);
        }
        logs.position.y=.2; b.add(logs);
        const stones = new THREE.Group();
        for(let i=0;i<5;i++){
            const s = new THREE.Mesh(new THREE.DodecahedronGeometry(.18,0), M.stone);
            const a = (i/5)*Math.PI*2;
            s.position.set(Math.cos(a)*.5,.12,Math.sin(a)*.5);
            stones.add(s);
        }
        b.add(stones);
        const flame = new THREE.Mesh(new THREE.ConeGeometry(.25,.5,6), new THREE.MeshBasicMaterial({color:0xff6622}));
        flame.position.y=.6; b.add(flame);
        const fireLight = new THREE.PointLight(0xff8833, 1.8, def.light);
        fireLight.position.y=.8; b.add(fireLight);
        b.userData.flame = flame; b.userData.fireLight = fireLight;
    } break;
    case 'torch':{
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,1.5,6), M.wood);
        pole.position.y=.75; b.add(pole);
        const flame = new THREE.Mesh(new THREE.ConeGeometry(.2,.45,6), new THREE.MeshBasicMaterial({color:0xff6622}));
        flame.position.y=1.55; b.add(flame);
        const L = new THREE.PointLight(0xff8833, 1.2, def.light);
        L.position.y=1.55; b.add(L);
        b.userData.flame=flame;
    } break;
    case 'lantern':{
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(.08,.12,2,8), M.metal);
        pole.position.y=1; b.add(pole);
        const top = new THREE.Mesh(new THREE.CylinderGeometry(.22,.18,.3,8), M.brass);
        top.position.y=2.15; b.add(top);
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(.2,8,8), new THREE.MeshBasicMaterial({color:0xffaa44}));
        bulb.position.y=2.25; b.add(bulb);
        b.add(new THREE.PointLight(0xffaa66, 1.5, def.light).position.set(0,2.25,0));
    } break;
    case 'wall':{
        const w = new THREE.Mesh(new THREE.BoxGeometry(cellSize*.9,1.5,.35), M.stone);
        w.position.y=.75; b.add(w);
        for(let i=0;i<6;i++){
            const r = new THREE.Mesh(new THREE.SphereGeometry(.05,6,6), M.brass);
            r.position.set(-.8+(i%3)*.8,.35+Math.floor(i/3)*.7,.2);
            b.add(r);
        }
    } break;
    case 'spike':{
        const base = new THREE.Mesh(new THREE.CylinderGeometry(.6,.7,.15,8), M.metal);
        base.position.y=.07; b.add(base);
        for(let i=0;i<6;i++){
            const a = (i/6)*Math.PI*2;
            const sp = new THREE.Mesh(new THREE.ConeGeometry(.08,.6,6), M.metal);
            sp.position.set(Math.cos(a)*.35,.4,Math.sin(a)*.35);
            sp.rotation.z = Math.cos(a)*.4;
            sp.rotation.x = Math.sin(a)*.4;
            b.add(sp);
        }
    } break;
    case 'cannon':{
        const base = new THREE.Mesh(new THREE.BoxGeometry(1.1,.35,1.1), M.wood);
        base.position.y=.2; b.add(base);
        const tur = new THREE.Mesh(new THREE.CylinderGeometry(.4,.5,.4,8), M.metal);
        tur.position.y=.55; b.add(tur);
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,1.4,8), M.metal);
        barrel.rotation.x=Math.PI/2; barrel.position.set(0,.6,.75); b.add(barrel);
        b.userData.tur=tur; b.userData.barrel=barrel;
    } break;
    case 'watchtower':{
        const base = new THREE.Mesh(new THREE.BoxGeometry(1.3,.4,1.3), M.stone);
        base.position.y=.2; b.add(base);
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,3.5,8), M.metal);
        shaft.position.y=2.15; b.add(shaft);
        const top = new THREE.Mesh(new THREE.ConeGeometry(.7,.9,8), M.brass);
        top.position.y=4.7; b.add(top);
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(.45,8,8), new THREE.MeshBasicMaterial({color:0xffdd88}));
        bulb.position.y=3.9; b.add(bulb);
        b.add(new THREE.PointLight(0xffdd66, 2.2, def.light).position.set(0,3.9,0));
    } break;
    case 'workshop':{
        const b1 = new THREE.Mesh(new THREE.BoxGeometry(2.2,.35,1.8), M.wood); b1.position.y=.2; b.add(b1);
        const b2 = new THREE.Mesh(new THREE.BoxGeometry(2,1.3,1.6), new THREE.MeshLambertMaterial({color:0x7a5a3a}));
        b2.position.y=1; b.add(b2);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(1.8,1,4), new THREE.MeshLambertMaterial({color:0x3a2a1a}));
        roof.position.y=2.2; roof.rotation.y=Math.PI/4; b.add(roof);
        b.add(new THREE.PointLight(0xff8833, .8, def.light).position.set(0,1.8,0));
    } break;
    case 'bed':{
        const base = new THREE.Mesh(new THREE.BoxGeometry(1.8,.3,1), M.wood);
        base.position.y=.15; b.add(base);
        const mat = new THREE.Mesh(new THREE.BoxGeometry(1.6,.15,.9), new THREE.MeshLambertMaterial({color:0x8a6a3a}));
        mat.position.y=.37; b.add(mat);
        const pillow = new THREE.Mesh(new THREE.BoxGeometry(.5,.15,.8), new THREE.MeshLambertMaterial({color:0xc9a961}));
        pillow.position.set(-.55,.5,.02); b.add(pillow);
    } break;
    }

    b.traverse(c=>{if(c.isMesh){c.castShadow=!IS_MOBILE;c.receiveShadow=!IS_MOBILE}});
    b.position.set(pos.x, cell.height, pos.z);

    if (instant) {
        scene.add(b);
        cell.building = b;
    } else {
        // 建造中 placeholder
        b.visible = false;
        const ph = new THREE.Mesh(new THREE.BoxGeometry(.6,.5,.6), new THREE.MeshBasicMaterial({color:0x8a6a3a,transparent:true,opacity:.5}));
        ph.position.set(pos.x, cell.height+.25, pos.z);
        scene.add(ph);
        queue.push({ type, pos, cell, b, ph, progress:0, total:def.build });
    }
    return b;
}

function tryBuild(type, worldPos) {
    const def = BUILDINGS[type];
    for (const [r,a] of Object.entries(def.cost)) {
        if ((playerData.inv[r]||0) < a) { showMsg(`${resName(r)}不足！需 ${a-(playerData.inv[r]||0)}`, 'warn'); return; }
    }
    const cell = getCell(worldPos.x, worldPos.z);
    if (!cell) { showMsg('无法建造','warn'); return; }
    if (!cell.buildable) { showMsg('此处不能建造','warn'); return; }
    if (cell.building) { showMsg('这里已有东西','warn'); return; }
    if (!cell.revealed) { showMsg('先探索这个区域','warn'); return; }
    if (playerData.pos.distanceTo(worldPos) > 15) { showMsg('太远了','warn'); return; }

    for (const [r,a] of Object.entries(def.cost)) playerData.inv[r] -= a;
    buildStructure(type, worldPos);
    showMsg(`开始建造 ${def.name}`, 'info');
    updateUI();
}

// ================== 投放系统 ==================
function rollDrop() {
    const size = mapSize;
    const center = { x: size/2, z: size/2 };
    const attempts = 10;

    for (let a=0; a<attempts; a++) {
        const x = Math.floor(Math.random()*size);
        const z = Math.floor(Math.random()*size);
        const cell = cells[x][z];
        if (!cell.buildable) continue;
        const dist = Math.sqrt((x-center.x)**2 + (z-center.z)**2);
        if (dist < 5) continue; // 不远投在出生点
        if (cell.building) continue; // 建筑范围不投

        // 稀有度权重抽取
        const totalW = Object.values(RARITY).reduce((s,r)=>s+r.weight,0);
        let roll = Math.random()*totalW;
        let chosenRarity = 'common';
        for (const [k,v] of Object.entries(RARITY)) {
            roll -= v.weight;
            if (roll <= 0) { chosenRarity = k; break; }
        }
        if (chosenRarity === 'memory') {
            // 记忆碎片（极罕见）
            spawnFragment(cell);
            return;
        }
        // 从该稀有度池选物品
        const pool = DROP_TABLE.filter(d=>d.rarity===chosenRarity);
        const drop = pool[Math.floor(Math.random()*pool.length)];
        spawnDrop(cell, drop, chosenRarity);
        return;
    }
}

function spawnDrop(cell, drop, rarityKey) {
    const g = new THREE.Group();
    const rarity = RARITY[rarityKey];
    const size = .3 + Math.random()*.15;
    const geo = new THREE.BoxGeometry(size,size,size);
    const mat = new THREE.MeshLambertMaterial({ color: rarity.color, emissive: rarity.color, emissiveIntensity:.3, metalness:.4 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = !IS_MOBILE;
    g.add(mesh);

    // 小光效
    const sp = new THREE.PointLight(rarity.color, .6, 2);
    g.add(sp);

    g.userData = { isDrop:true, drop, rarity:rarityKey, vy:.1, cellX:cell.x, cellZ:cell.z, rot:Math.random()*Math.PI*2 };
    g.position.set(cell.wx+(Math.random()-.5)*cellSize*.8, cell.height+.5, cell.wz+(Math.random()-.5)*cellSize*.8);
    scene.add(g);
    drops.push(g);
    cell.drop = g;

    // 下落动画
    g.userData.fallFrom = g.position.y + 3;
    g.userData.targetY = cell.height + .5;
    g.position.y = g.userData.fallFrom;
}

function spawnFragment(cell) {
    if (memoryPieces.length >= CFG.VICTORY_FRAGMENTS + 2) return; // 上限
    const g = new THREE.Group();
    const shape = new THREE.IcosahedronGeometry(.35, 0);
    const mat = new THREE.MeshLambertMaterial({ color: 0xa855f7, emissive:0xa855f7, emissiveIntensity:1 });
    const shard = new THREE.Mesh(shape, mat);
    g.add(shard);
    const L = new THREE.PointLight(0xa855f7, 1.5, 4);
    g.add(L);
    g.userData = { isFragment:true, cellX:cell.x, cellZ:cell.z, rot:0 };
    g.position.set(cell.wx, cell.height+.6, cell.wz);
    scene.add(g);
    fragments.push(g);
    cell.fragment = g;
    showMsg('📡 有什么东西在附近闪烁...', 'mem');
}

function collectDrop(d) {
    const cell = cells[d.userData.cellX][d.userData.cellZ];
    if (cell) cell.drop = null;
    const drop = d.userData.drop;
    const amt = Math.floor(Math.random()*2)+1; // 1-2 个
    playerData.inv[drop.item] = (playerData.inv[drop.item]||0) + amt;
    showPickup(drop, amt, d.userData.rarity);
    scene.remove(d);
    drops = drops.filter(x => x!==d);
    updateUI();
}

function collectFragment(f) {
    const cell = cells[f.userData.cellX][f.userData.cellZ];
    if (cell) cell.fragment = null;
    memoryPieces.push(f);
    showMsg(`✨ 拾得记忆碎片 (${memoryPieces.length}/${CFG.VICTORY_FRAGMENTS})`, 'mem');
    scene.remove(f);
    fragments = fragments.filter(x => x!==f);

    // 到达胜利条件
    if (memoryPieces.length >= CFG.VICTORY_FRAGMENTS) {
        setTimeout(() => endGame('victory'), 1500);
    }
}

function showPickup(drop, amt, rarityKey) {
    const rarity = RARITY[rarityKey];
    const div = document.createElement('div');
    div.className = 'pickup-flash';
    div.innerHTML = `<div style="color:${'#'+rarity.color.toString(16).padStart(6,'0')};font-size:14px;margin-bottom:4px">${rarity.name}</div>
                    <div style="font-size:16px">${drop.icon} ${drop.label} ×${amt}</div>`;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 2500);
}

// ================== 威胁 ==================
function spawnThreat() {
    const size = mapSize;
    for (let a=0;a<20;a++) {
        const x = Math.floor(Math.random()*size);
        const z = Math.floor(Math.random()*size);
        const cell = cells[x][z];
        if (!cell.buildable) continue;
        if (cell.lit) continue;
        const dist = playerData.pos.distanceTo(new THREE.Vector3(cell.wx,0,cell.wz));
        if (dist > 12 && dist < 30) {
            threats.push(createThreat(new THREE.Vector3(cell.wx, cell.height, cell.wz)));
            return;
        }
    }
}

function createThreat(pos) {
    const g = new THREE.Group();
    const roll = Math.random();
    let stats;
    if (roll < .4) {
        stats = { hp:35, dmg:10, spd:3, range:1.5, atkSpd:1.5 };
        const body = new THREE.Mesh(new THREE.BoxGeometry(.8,.5,1.2), new THREE.MeshLambertMaterial({color:0x1a0a1a}));
        body.position.y=.4; g.add(body);
        const head = new THREE.Mesh(new THREE.BoxGeometry(.4,.4,.5), new THREE.MeshLambertMaterial({color:0x1a0a1a}));
        head.position.set(0,.5,.7); g.add(head);
        const eye = new THREE.Mesh(new THREE.SphereGeometry(.05,6,6), new THREE.MeshBasicMaterial({color:0xff0000}));
        const e2 = eye.clone(); e2.position.set(-.1,.55,.95); eye.position.set(.1,.55,.95);
        g.add(eye,e2);
        for(let i=0;i<4;i++){
            const l = new THREE.Mesh(new THREE.BoxGeometry(.12,.3,.12), new THREE.MeshLambertMaterial({color:0x1a0a1a}));
            l.position.set(i<2?-.3:.3, .15, i%2===0?-.4:.4); g.add(l);
        }
    } else if (roll < .75) {
        stats = { hp:30, dmg:15, spd:2, range:1.8, atkSpd:2 };
        const body = new THREE.Mesh(new THREE.SphereGeometry(.6,8,8), new THREE.MeshLambertMaterial({color:0x0a050a}));
        body.position.y=.5; g.add(body);
        for(let i=0;i<6;i++){
            const ang = (i/6)*Math.PI*2;
            const t = new THREE.Mesh(new THREE.CylinderGeometry(.04,.06,.5,4), new THREE.MeshLambertMaterial({color:0x0a050a}));
            t.position.set(Math.cos(ang)*.4,.3,Math.sin(ang)*.4); t.rotation.x=ang;
            g.add(t);
        }
        const eye = new THREE.Mesh(new THREE.SphereGeometry(.12,8,8), new THREE.MeshBasicMaterial({color:0xff4400}));
        eye.position.y=.7; g.add(eye);
    } else {
        stats = { hp:100, dmg:25, spd:1.4, range:2, atkSpd:1 };
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.3,1.8,1), new THREE.MeshLambertMaterial({color:0x150815}));
        body.position.y=.9; g.add(body);
        const head = new THREE.Mesh(new THREE.BoxGeometry(.7,.7,.7), new THREE.MeshLambertMaterial({color:0x150815}));
        head.position.y=2.1; g.add(head);
        for(let i=0;i<2;i++){
            const h = new THREE.Mesh(new THREE.ConeGeometry(.1,.4,4), new THREE.MeshLambertMaterial({color:0x3a1a3a}));
            h.position.set(i===0?-.22:.22, 2.6, 0); g.add(h);
        }
        const e = new THREE.Mesh(new THREE.SphereGeometry(.08,8,8), new THREE.MeshBasicMaterial({color:0xff0000}));
        const e2 = e.clone(); e.position.set(-.18,2.2,.35); e2.position.set(.18,2.2,.35);
        g.add(e,e2);
    }
    g.userData = { hp:stats.hp, maxHp:stats.hp, dmg:stats.dmg, spd:stats.spd, range:stats.range, atkSpd:stats.atkSpd, atkT:0, eye:g.children.filter(c=>c.material&&c.material.color&&['#ff0000','#ff4400'].some(x=>c.material.color.getHexString()===x.replace('#','')))[0] };
    g.position.copy(pos);
    scene.add(g);
    return g;
}

// ================== 战斗 & 威胁AI ==================
function attack() {
    if (gameState!=='playing' || playerData.attackCd>0) return;
    playerData.attackCd = .45;
    let closest=null, cd=2.5;
    for (const t of threats){
        if (t.userData.hp<=0) continue;
        const d = playerData.pos.distanceTo(t.position);
        if (d<cd){ cd=d; closest=t; }
    }
    if (closest){
        closest.userData.hp -= 20+Math.random()*10;
        showDamage(closest.position, 20+Math.random()*10);
        if (closest.userData.hp<=0){
            showMsg('击败威胁','success');
            scene.remove(closest);
            threats = threats.filter(t=>t!==closest);
        }
    }
}

function showDamage(pos, dmg) {
    const v = pos.clone(); v.y+=1; v.project(camera);
    const el = document.createElement('div');
    el.className = 'pickup-flash';
    el.style.color = '#ff4444';
    el.style.fontSize = '18px';
    el.style.fontWeight = 'bold';
    el.innerHTML = `-${Math.round(dmg)}`;
    el.style.background = 'rgba(10,6,3,.7)';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 800);
}

// ================== 建造放置 ==================
function onCanvasClick(e) {
    if (gameState!=='playing') return;
    if (!playerData.currentBuild) return;
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(
        (e.clientX/window.innerWidth)*2-1,
        -(e.clientY/window.innerHeight)*2+1
    ), camera);
    const terrain = scene.getObjectByName('terrain');
    const hits = raycaster.intersectObjects(terrain.children);
    if (hits.length>0) tryBuild(playerData.currentBuild, hits[0].point);
}

// ================== UI 构建 ==================
function resName(r) {
    const n = { wood:'木材', stone:'石料', fiber:'纤维', scrap:'废金属', cloth:'布匹', food:'口粮', coal:'煤炭', iron:'铁锭', copper:'铜锭', foodpack:'高级口粮', electronics:'电子件', alloy:'合金', medicine:'药剂', gear:'精密齿轮', metal:'金属' };
    return n[r] || r;
}

function setupUI() {
    // Tab 切换
    document.querySelectorAll('.tab').forEach(t => {
        t.addEventListener('click', () => selectTab(t.dataset.tab));
    });
    const invBtn = document.getElementById('invBtn');
    if (invBtn) invBtn.addEventListener('click', ()=> selectTab('inv'));

    updateUI();
    updateMinimap();
}

function selectTab(tab) {
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.dataset.panel===tab));
    if (tab==='inv') updateInvPanel();
}

function updateUI() {
    // 建造 tab - 只显示 cost 里全在玩家背包里（或 workshop 已建造解锁高级）的
    const toolsGrid = document.getElementById('toolsGrid');
    const buildGrid = document.getElementById('buildGrid');
    const hasWorkshop = scene.children.some(o=>o.userData.build && o.userData.bm && o.userData.bm.workshop && !o.userData.bm.destroyed);

    toolsGrid.innerHTML = '';
    for (const [key,def] of Object.entries(TOOLS)){
        const canAfford = Object.entries(def.cost).every(([r,a]) => (playerData.inv[r]||0)>=a);
        const unlocked = true; // 工具都可用
        const card = document.createElement('div');
        card.className = 'build-card' + (canAfford&&unlocked ? '' : ' disabled');
        card.innerHTML = `<div class="build-icon">${def.icon}</div><div class="build-name">${def.name}</div><div class="build-cost">${Object.entries(def.cost).map(([r,a])=>`${a}${resName(r)}`).join(' ')}</div>`;
        card.title = def.desc;
        if (canAfford&&unlocked) card.onclick = () => useTool(key);
        toolsGrid.appendChild(card);
    }

    buildGrid.innerHTML = '';
    for (const [key,def] of Object.entries(BUILDINGS)){
        if (key==='campfire') continue; // 初始篝火

        // 工坊以下解锁
        const needsWorkshop = ['cannon','watchtower','workshop','alloy','medicine','gear'].includes(key) ||
                              def.cost.iron || def.cost.gear || def.cost.alloy;
        const unlocked = !needsWorkshop || hasWorkshop;

        const canAfford = unlocked && Object.entries(def.cost).every(([r,a]) => (playerData.inv[r]||0)>=a);
        const card = document.createElement('div');
        card.className = 'build-card';
        if (!unlocked) card.classList.add('disabled');
        if (unlocked && !canAfford) card.classList.add('disabled');
        if (playerData.currentBuild===key) card.classList.add('selected');
        if (!unlocked) card.innerHTML = `<div style="font-size:20px">🔒</div><div class="build-name">需要工坊</div>`;
        else {
            card.innerHTML = `<div class="build-icon">${def.icon}</div><div class="build-name">${def.name}</div><div class="build-cost">${Object.entries(def.cost).map(([r,a])=>`${a}${resName(r)}`).join(' ')}</div>`;
            card.title = def.desc;
            if (canAfford) card.onclick = () => { playerData.currentBuild = playerData.currentBuild===key ? null : key; updateUI(); };
        }
        buildGrid.appendChild(card);
    }

    // HUD
    document.getElementById('hpBar').style.width = Math.max(0,playerData.hp)+'%';
    document.getElementById('hpTxt').textContent = Math.round(playerData.hp);
    document.getElementById('foodBar').style.width = Math.max(0,playerData.food)+'%';
    document.getElementById('foodTxt').textContent = Math.round(playerData.food);
    document.getElementById('sanBar').style.width = Math.max(0,playerData.sanity)+'%';
    document.getElementById('sanTxt').textContent = Math.round(playerData.sanity);
    document.getElementById('memCount').textContent = `${memoryPieces.length}/${CFG.VICTORY_FRAGMENTS}`;

    // 移动端建造提示
    if (playerData.currentBuild) {
        document.getElementById('mobHint').classList.add('active');
        document.getElementById('mobHint').textContent = `当前建造: ${BUILDINGS[playerData.currentBuild].name}\n点击放置`;
    } else {
        document.getElementById('mobHint').classList.remove('active');
    }
}

function updateInvPanel() {
    const grid = document.getElementById('invGrid');
    grid.innerHTML = '';
    const items = Object.entries(playerData.inv).filter(([k,v])=>v>0);
    if (items.length===0){
        grid.innerHTML = '<div style="color:#5a4a2a;font-size:10px;padding:10px">收集器空空如也...系统会定时投放物资</div>';
        return;
    }
    for (const [k,v] of items){
        const drop = DROP_TABLE.find(d=>d.item===k);
        const isTool = TOOLS[k];
        const icon = drop?.icon || isTool?.icon || '📦';
        const label = drop?.label || isTool?.name || resName(k);

        const card = document.createElement('div');
        card.className = 'inv-card';
        card.innerHTML = `
            <div class="inv-icon">${icon}</div>
            <div class="inv-info">
                <div class="inv-name">${label}</div>
                <div class="inv-count">×${v}</div>
            </div>`;
        if (isTool || k==='food' || k==='foodpack' || k==='medicine') {
            const btn = document.createElement('div');
            btn.className = 'inv-btn'; btn.textContent = '使用';
            btn.onclick = (ev) => { ev.stopPropagation(); useInvItem(k); };
            card.appendChild(btn);
        }
        grid.appendChild(card);
    }
}

function useTool(key) {
    // 工具 = 直接建造（消耗cost → 生成对应效果）
    const def = TOOLS[key];
    for (const [r,a] of Object.entries(def.cost)) {
        if ((playerData.inv[r]||0)<a){ showMsg(`${resName(r)}不足`,'warn'); return; }
    }
    for (const [r,a] of Object.entries(def.cost)) playerData.inv[r]-=a;

    if (key==='torch_item') {
        // 即时火把（放玩家脚下）
        buildStructure('torch', new THREE.Vector3(playerData.pos.x, cells[mapSize/2][mapSize/2].height, playerData.pos.z));
        showMsg('放置了火把','info');
    } else if (key==='medicine') {
        playerData.hp = Math.min(100, playerData.hp+40);
        showMsg('恢复 40 生命值','success');
    } else if (key==='foodpack') {
        playerData.food = Math.min(100, playerData.food+50);
        showMsg('恢复饱腹度','success');
    } else if (key==='repair_kit') {
        // 修最近的建筑
        let target=null, td=8;
        scene.traverse(o=>{
            if (o.userData.build && o.userData.bm && !o.userData.bm.destroyed) {
                const d = playerData.pos.distanceTo(o.position);
                if (d<td){ td=d; target=o; }
            }
        });
        if (target){
            target.userData.bm.hp = Math.min(target.userData.bm.maxHp, target.userData.bm.hp+30);
            showMsg('修复了建筑','success');
        } else {
            showMsg('附近没有可修的','warn');
        }
    }
    updateUI(); updateInvPanel();
}

function useInvItem(k) {
    if (k==='food' || k==='foodpack' || k==='medicine') {
        playerData.inv[k]--;
        if (k==='food') { playerData.food = Math.min(100, playerData.food+25); showMsg('吃了口粮 (+25 饱腹)','success'); }
        if (k==='foodpack') { playerData.food = Math.min(100, playerData.food+60); showMsg('吃了高级口粮 (+60 饱腹)','success'); }
        if (k==='medicine') { playerData.hp = Math.min(100, playerData.hp+40); showMsg('用药 (+40 HP)','success'); }
        if (playerData.inv[k]<=0) delete playerData.inv[k];
        updateUI(); updateInvPanel();
    }
}

function useNearby() {
    // 休息点恢复精神
    scene.traverse(o=>{
        if (o.userData.build && o.userData.bm && o.userData.bm.bed && !o.userData.bm.destroyed) {
            if (playerData.pos.distanceTo(o.position) < 4) {
                playerData.sanity = Math.min(100, playerData.sanity+15);
                showMsg('在休息点恢复了精神','success');
            }
        }
        if (o.userData.build && o.userData.bm && o.userData.bm.workshop && !o.userData.bm.destroyed) {
            if (playerData.pos.distanceTo(o.position) < 5) {
                showMsg('工坊已解锁全部高级建造','info');
            }
        }
    });
}

function showMsg(text, type='info') {
    const log = document.getElementById('msgLog');
    const div = document.createElement('div');
    div.className = 'msg ' + (type==='warn'?'warn':type==='mem'?'mem':type==='success'?'success':'');
    div.textContent = text;
    log.appendChild(div);
    while (log.children.length > 5) log.removeChild(log.firstChild);
    setTimeout(()=>{ div.style.opacity='0'; setTimeout(()=>div.remove(), 500); }, 4000);
}

function updateMinimap() {
    const canvas = document.getElementById('minimap');
    const ctx = canvas.getContext('2d');
    const size = mapSize;
    const cs = canvas.width/size;
    ctx.fillStyle = '#0a0603'; ctx.fillRect(0,0,canvas.width,canvas.height);
    for (let x=0;x<size;x++) for (let z=0;z<size;z++){
        const c = cells[x][z];
        const px=x*cs, py=z*cs;
        if (c.lit){
            const col = {grassland:'#4a5a35',desert:'#8a7a4a',forest:'#2a4520',ocean:'#3a6a7a',snow:'#c8d4dc',gobi:'#6a6258'}[c.terrain];
            ctx.fillStyle = col||'#555'; ctx.fillRect(px,py,cs+1,cs+1);
            if (c.building){ ctx.fillStyle='#ffdd66'; ctx.fillRect(px+cs/4,py+cs/4,cs/2,cs/2); }
            if (c.fragment){ ctx.fillStyle='#a855f7'; ctx.fillRect(px+cs/3,py+cs/3,cs/3,cs/3); }
        } else if (c.revealed){
            ctx.fillStyle = '#1e1812'; ctx.fillRect(px,py,cs+1,cs+1);
        }
    }
    const px2 = (size/2 + playerData.pos.x/cellSize)*cs;
    const py2 = (size/2 + playerData.pos.z/cellSize)*cs;
    ctx.fillStyle='#ffaa33';
    ctx.beginPath(); ctx.arc(px2,py2,3,0,Math.PI*2); ctx.fill();
}

// ================== 移动端 ==================
function setupMobile() {
    const joy = document.getElementById('joystick');
    const knob = document.querySelector('#joystick .knob');

    joy.addEventListener('touchstart', e=>{
        e.preventDefault();
        const t = e.changedTouches[0];
        mobile.jid = t.identifier;
        mobile.jc = {x:t.clientX, y:t.clientY};
        updateJoy(t.clientX, t.clientY);
    }, {passive:false});
    joy.addEventListener('touchmove', e=>{
        e.preventDefault();
        for (const t of e.changedTouches)
            if (t.identifier===mobile.jid) updateJoy(t.clientX, t.clientY);
    }, {passive:false});
    const reset = e => {
        e.preventDefault();
        for (const t of e.changedTouches)
            if (t.identifier===mobile.jid){ mobile.jid=null; mobile.move.x=0; mobile.move.y=0; knob.style.transform='translate(-50%,-50%)'; }
    };
    joy.addEventListener('touchend', reset, {passive:false});
    joy.addEventListener('touchcancel', reset, {passive:false});

    function updateJoy(x,y){
        const dx=x-mobile.jc.x, dy=y-mobile.jc.y, max=50;
        const d = Math.min(Math.sqrt(dx*dx+dy*dy), max);
        const ang = Math.atan2(dy,dx);
        const nx = Math.cos(ang)*(d/max), ny = Math.sin(ang)*(d/max);
        mobile.move.x = nx; mobile.move.y = ny;
        knob.style.transform = `translate(calc(-50% + ${nx*max}px), calc(-50% + ${ny*max}px))`;
    }

    document.getElementById('btnAttack').addEventListener('touchstart', e=>{e.preventDefault(); attack();}, {passive:false});
    document.getElementById('btnPlace').addEventListener('touchstart', e=>{
        e.preventDefault();
        if (!playerData.currentBuild){
            const seq = ['torch','lantern','wall','spike','cannon','watchtower','workshop','bed'];
            const i = Math.floor(Math.random()*seq.length);
            playerData.currentBuild = seq[i];
        }
        // 找到相机中心位置放置
        const target = playerData.pos.clone();
        target.x += Math.cos(playerGroup.rotation.y)*4;
        target.z += Math.sin(playerGroup.rotation.y)*4;
        tryBuild(playerData.currentBuild, target);
    }, {passive:false});

    // 画面tap放置
    let tStart = null;
    renderer.domElement.addEventListener('touchstart', e=>{
        if (mobile.jid!==null) return;
        if (!playerData.currentBuild) return;
        tStart = e.changedTouches[0];
    }, {passive:true});
    renderer.domElement.addEventListener('touchend', e=>{
        if (!tStart) return;
        const t = e.changedTouches[0];
        const dx=t.clientX-tStart.clientX, dy=t.clientY-tStart.clientY;
        if (Math.sqrt(dx*dx+dy*dy)<15){
            const rc = new THREE.Raycaster();
            rc.setFromCamera(new THREE.Vector2(
                (t.clientX/window.innerWidth)*2-1,
                -(t.clientY/window.innerHeight)*2+1
            ), camera);
            const hits = rc.intersectObjects(scene.getObjectByName('terrain').children);
            if (hits.length>0) tryBuild(playerData.currentBuild, hits[0].point);
        }
        tStart=null;
    }, {passive:true});

    document.addEventListener('gesturestart', e=>e.preventDefault());
    document.addEventListener('contextmenu', e=>e.preventDefault());
}

// ================== 主循环 ==================
function animate() {
    const dt = clock.getDelta();
    if (gameState !== 'playing') {
        try { renderer.render(scene, camera); } catch(e){}
        requestAnimationFrame(animate);
        return;
    }
    gameTime += dt;

    // 昼夜（WebGL 降级时 sun 可能不存在）
    const sun = scene.userData.sun;
    let night = false;
    if (sun) {
        const prog = (gameTime % CFG.DAY_LEN) / CFG.DAY_LEN;
        sun.position.x = Math.cos(prog*Math.PI*2)*45;
        sun.position.y = Math.sin(prog*Math.PI*2)*45;
        sun.position.z = 20;
        night = sun.position.y < 0;
        sun.intensity = night ? 0.15 : 0.8;
    }

    // 玩家移动
    if (playerData.attackCd>0) playerData.attackCd-=dt;
    let dx=0, dz=0;
    if (keys['KeyW']) dz -= 1;
    if (keys['KeyS']) dz += 1;
    if (keys['KeyA']) dx -= 1;
    if (keys['KeyD']) dx += 1;
    dx += mobile.move.x;
    dz += mobile.move.y;

    const moved = dx!==0 || dz!==0;
    if (moved) {
        const len = Math.sqrt(dx*dx+dz*dz);
        dx/=len; dz/=len;
        const newX = playerData.pos.x + dx*CFG.PLAYER_SPEED*dt;
        const newZ = playerData.pos.z + dz*CFG.PLAYER_SPEED*dt;

        // 墙壁阻挡
        let bx=false, bz=false;
        for (const o of scene.children){
            if (o.userData.build && o.userData.bm && o.userData.bm.blocks && !o.userData.bm.destroyed){
                if (Math.abs(newX-o.position.x)<1 && Math.abs(playerData.pos.z-o.position.z)<1) bx=true;
                if (Math.abs(playerData.pos.x-o.position.x)<1 && Math.abs(newZ-o.position.z)<1) bz=true;
            }
        }
        if (!bx) playerData.pos.x = newX;
        if (!bz) playerData.pos.z = newZ;
        const bound = mapSize*cellSize/2-cellSize;
        playerData.pos.x = Math.max(-bound, Math.min(bound, playerData.pos.x));
        playerData.pos.z = Math.max(-bound, Math.min(bound, playerData.pos.z));
        const c = getCell(playerData.pos.x, playerData.pos.z);
        if (c && c.buildable) playerData.pos.y = c.height;

        playerGroup.rotation.y = Math.atan2(dx, dz);
        revealArea(playerData.pos, 7);
        updateLighting();
    }

    if (playerGroup) {
        playerGroup.position.copy(playerData.pos);
        playerGroup.position.y += Math.sin(gameTime*5)*.04*moved;
    }

    // 相机跟随
    if (camera) {
        const camTarget = new THREE.Vector3(playerData.pos.x, 17, playerData.pos.z + 12);
        camera.position.lerp(camTarget, 0.04);
        camera.lookAt(playerData.pos.x, 1, playerData.pos.z);
    }

    // 建造进度
    for (let i=queue.length-1; i>=0; i--){
        const q = queue[i];
        q.progress += dt;
        const frac = q.progress / q.total;
        q.ph.scale.set(0.3+frac*0.7, frac, 0.3+frac*0.7);
        q.ph.position.y = q.pos.y + frac*0.3;
        if (q.progress >= q.total){
            scene.remove(q.ph);
            scene.add(q.b);
            q.cell.building = q.b;
            q.b.visible = true;
            queue.splice(i,1);
            showMsg(`${BUILDINGS[q.type].name} 建造完成`,'success');
            updateLighting();
            updateUI();
        }
    }

    // 威胁生成（开局30秒后）
    if (gameTime > 25 && gameTime % CFG.SPAWN_INTERVAL < dt){
        if (Math.random() < 0.7) spawnThreat();
    }

    // 威胁AI
    for (let i=threats.length-1; i>=0; i--){
        const t = threats[i];
        const u = t.userData;
        if (u.hp<=0){ scene.remove(t); threats.splice(i,1); continue; }
        const cell = getCell(t.position.x, t.position.z);
        const inLight = cell && cell.lit;

        let target=null, tp=null, td=Infinity;
        const pd = t.position.distanceTo(playerData.pos);
        if (pd<td){ td=pd; target='player'; tp=playerData.pos; }
        // 建筑也吸引威胁
        scene.traverse(o=>{
            if (o.userData.build && o.userData.bm && !o.userData.bm.destroyed && (o.userData.bm.blocks || o.userData.bm.trap)){
                const d = t.position.distanceTo(o.position);
                if (d<15 && d<td){ td=d; target=o; tp=o.position; }
            }
        });
        if (tp){
            const dir = new THREE.Vector3().subVectors(tp, t.position).normalize();
            const spd = inLight ? u.spd*0.4 : u.spd;
            t.position.x += dir.x*spd*dt;
            t.position.z += dir.z*spd*dt;
            t.rotation.y = Math.atan2(dir.x, dir.z);
            u.atkT -= dt;
            if (u.atkT<=0 && td<u.range){
                u.atkT = 1/u.atkSpd;
                if (target==='player'){
                    playerData.hp -= u.dmg;
                    showMsg(`受到 ${u.dmg} 伤害！`,'warn');
                } else {
                    target.userData.bm.hp -= u.dmg;
                    if (target.userData.bm.hp<=0){
                        target.userData.bm.destroyed = true;
                        scene.remove(target);
                        const c = getCell(target.position.x, target.position.z);
                        if (c) c.building=null;
                        showMsg('建筑被摧毁！','warn');
                        updateLighting();
                    }
                }
            }
        }
    }

    // 炮台
    scene.traverse(o=>{
        if (o.userData.build && o.userData.bm && o.userData.bm.atk && !o.userData.bm.destroyed){
            o.userData.bm.atkT += dt;
            const b = o.userData.bm;
            if (b.atkT > 1/b.spd){
                let target=null, td=b.range;
                for (const t of threats){
                    if (t.userData.hp<=0) continue;
                    const d = o.position.distanceTo(t.position);
                    if (d<td){ td=d; target=t; }
                }
                if (target){
                    if (o.userData.tur){
                        const dx=target.position.x-o.position.x, dz=target.position.z-o.position.z;
                        o.userData.tur.rotation.y = Math.atan2(dx,dz);
                    }
                    // 发射
                    const p = new THREE.Mesh(new THREE.SphereGeometry(.12,8,8), new THREE.MeshBasicMaterial({color:0xff6622}));
                    p.position.set(o.position.x, .8, o.position.z);
                    const vel = new THREE.Vector3().subVectors(target.position, o.position).normalize().multiplyScalar(28);
                    p.userData = { vel, life:0, dmg:b.dmg };
                    scene.add(p);
                    projectiles.push(p);
                    b.atkT = 0;
                }
            }
        }
    });

    // 投射物
    for (let i=projectiles.length-1; i>=0; i--){
        const p = projectiles[i];
        p.position.add(p.userData.vel.clone().multiplyScalar(dt));
        p.userData.life += dt;
        let hit=false;
        for (const t of threats){
            if (t.userData.hp<=0) continue;
            if (p.position.distanceTo(t.position)<1.2){
                t.userData.hp -= p.userData.dmg;
                hit=true; break;
            }
        }
        if (hit || p.userData.life>3){
            scene.remove(p);
            projectiles.splice(i,1);
        }
    }

    // 篝火/火把火焰动画
    scene.traverse(o=>{
        if (o.userData.flame){
            o.userData.flame.scale.y = 1 + Math.sin(gameTime*8)*.15;
            o.userData.flame.scale.x = 1 + Math.cos(gameTime*10)*.1;
        }
        if (o.userData.fireLight){
            o.userData.fireLight.intensity = 1.5 + Math.sin(gameTime*6)*.3;
        }
    });

    // 投放下落 + 自动收集（视野内）
    for (let i=drops.length-1; i>=0; i--){
        const d = drops[i];
        if (d.position.y > d.userData.targetY){
            d.position.y -= 6*dt;
            d.rotation.y += dt*2;
            d.rotation.z += dt*1.5;
            if (d.position.y <= d.userData.targetY) d.position.y = d.userData.targetY;
        } else {
            d.rotation.y += dt*2;
        }
        // 视野检查 + 收集
        const distToPlayer = playerData.pos.distanceTo(d.position);
        if (distToPlayer < CFG.AUTO_PICKUP_RANGE || isDropInView(d)) {
            collectDrop(d);
        }
    }

    // 记忆碎片旋转 + 靠近拾取
    for (let i=fragments.length-1; i>=0; i--){
        const f = fragments[i];
        f.rotation.y += dt*1.5;
        f.rotation.x += dt*.8;
        f.position.y = f.position.y + Math.sin(gameTime*2+i)*dt*0.3;
        if (playerData.pos.distanceTo(f.position) < 3) collectFragment(f);
    }

    // 系统定时投放（随机间隔）
    if (typeof nextSpawnTime === 'undefined' || gameTime > nextSpawnTime){
        rollDrop();
        nextSpawnTime = gameTime + CFG.SPAWN_INTERVAL + Math.random()*4;
    }

    // 玩家状态衰减
    playerData.food -= .35*dt;
    if (playerData.food<0){ playerData.food=0; playerData.hp -= .6*dt; }
    const pc = getCell(playerData.pos.x, playerData.pos.z);
    if (pc && (!pc.lit || night)){
        playerData.sanity -= (night?0.2:0.1)*dt;
    } else {
        playerData.sanity += 0.05*dt;
    }
    if (playerData.sanity<20) playerData.hp -= .3*dt;
    if (playerData.food>30 && playerData.sanity>30 && playerData.hp<100) playerData.hp += 1*dt;
    playerData.sanity = Math.max(0, Math.min(100, playerData.sanity));
    playerData.food = Math.max(0, Math.min(100, playerData.food));
    if (playerData.hp<=0) endGame('defeat');

    updateUI();
    updateMinimap();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}

// 投放物是否在玩家视野内
function isDropInView(d){
    const v = d.position.clone().project(camera);
    return v.z < 1 && v.x > -1 && v.x < 1 && v.y > -1 && v.y < 1;
}

function endGame(result) {
    gameState = result;
    const sc = document.getElementById('vicScreen');
    sc.classList.add('show');
    const stats = document.getElementById('vicStats');
    if (result === 'victory'){
        const days = Math.floor(gameTime / CFG.DAY_LEN) + 1;
        const built = scene.children.filter(o=>o.userData.build && !o.userData.bm?.destroyed).length;
        stats.innerHTML = `在沙箱 ${sandboxId} 中生存了 ${days} 天<br>建造: ${built} 座设施 | 收集: ${memoryPieces.length} 记忆碎片`;
    } else {
        document.querySelector('#vicScreen .victory-title').textContent = '意识湮灭';
        document.querySelector('#vicScreen .victory-title').className = 'victory-title defeat';
        document.querySelector('#vicScreen .victory-text').innerHTML = `你的意识在沙箱中消散。<br>直播仍在继续——<br>只是屏幕上的人换了一个。`;
        const days = Math.floor(gameTime / CFG.DAY_LEN) + 1;
        stats.innerHTML = `沙箱 ${sandboxId} | 存活 ${days} 天 | 碎片 ${memoryPieces.length}/5`;
    }
}

    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(10,6,3,.95);color:#ff6666;padding:20px;font:12px monospace;white-space:pre-wrap;overflow:auto';
    box.textContent = '❌ JS ERROR\n' + (e.message||e.error?.message||String(e)) + '\n\nStack:\n' + (e.error?.stack||e.filename+':'+e.lineno);
    document.body.appendChild(box);
});
window.addEventListener('unhandledrejection', e => {
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(10,6,3,.95);color:#ff6666;padding:20px;font:12px monospace;white-space:pre-wrap;overflow:auto';
    box.textContent = '❌ PROMISE ERROR\n' + String(e.reason);
    document.body.appendChild(box);
});

requestAnimationFrame(()=>{
    // UI 优先：保证设置面板和开始按钮在任何 WebGL 错误前都能工作
    try { settingsInit(); } catch(e) { console.warn('settingsInit failed', e); }

    try {
        clock = new THREE.Clock();
        init();
    } catch(err) {
        console.error('INIT FAILED:', err);
        const box = document.createElement('div');
        box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(10,6,3,.95);color:#ff6666;padding:20px;font:12px monospace;white-space:pre-wrap;overflow:auto';
        box.textContent = '❌ INIT FAILED\n' + err.message + '\n\nStack:\n' + err.stack;
        document.body.appendChild(box);
    }

    // 不管 init 是否成功，都绑定开始按钮（保底）
    try { rollStartSequence(); } catch(e) { console.warn('rollStartSequence failed', e); }
});
</script>
</body>
</html>
