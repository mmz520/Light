<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0603">
<title>迷雾之地 - 蒸汽朋克生存建造</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a0a0a;font-family:'Courier New',monospace;color:#c9a961}
canvas{display:block}

.hud{position:absolute;pointer-events:none;z-index:10}
.hud-top{top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}

.stat-panel{background:linear-gradient(135deg,#2a1f15 0%,#1a1208 100%);border:2px solid #8b6914;border-radius:4px;padding:8px 14px;box-shadow:0 0 12px rgba(139,105,20,.4),inset 0 0 8px rgba(0,0,0,.5);min-width:160px}
.stat-title{font-size:11px;color:#8b6914;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;border-bottom:1px dashed #8b6914;padding-bottom:3px}
.stat-bar-container{height:14px;background:#0a0603;border:1px solid #5a4a2a;margin:3px 0;position:relative;overflow:hidden}
.stat-bar{height:100%;transition:width .3s ease;position:relative}
.health-bar{background:linear-gradient(90deg,#8b1a1a,#c94a4a)}
.hunger-bar{background:linear-gradient(90deg,#5a3a1a,#c99a4a)}
.sanity-bar{background:linear-gradient(90deg,#2a4a6a,#4a8aca)}
.stat-text{font-size:10px;color:#c9a961;position:absolute;right:5px;top:50%;transform:translateY(-50%);text-shadow:1px 1px 0 #000}

.resources{display:flex;gap:12px;flex-wrap:wrap;max-width:400px}
.resource-item{background:linear-gradient(135deg,#2a1f15,#1a1208);border:1px solid #8b6914;padding:4px 8px;font-size:11px;color:#c9a961;box-shadow:inset 0 0 5px rgba(0,0,0,.5)}
.resource-item.low{border-color:#c94a4a;animation:pulseLow 1s infinite}
@keyframes pulseLow{0%,100%{border-color:#c94a4a}50%{border-color:#ff6666}}

.build-menu{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#2a1f15,#1a1208);border:3px solid #8b6914;border-radius:6px;padding:10px;box-shadow:0 0 20px rgba(139,105,20,.5);pointer-events:auto;display:flex;gap:8px}
.build-item{width:72px;height:82px;background:linear-gradient(135deg,#3a2f1f,#2a1f15);border:2px solid #8b6914;border-radius:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .2s;position:relative}
.build-item:hover{border-color:#c9a961;box-shadow:0 0 15px rgba(201,169,97,.6);transform:translateY(-3px)}
.build-item.selected{border-color:#ffd700;box-shadow:0 0 20px rgba(255,215,0,.8);background:linear-gradient(135deg,#4a3f2f,#3a2f1f)}
.build-item.disabled{opacity:.4;cursor:not-allowed}
.build-item.locked{opacity:.3;cursor:not-allowed;filter:grayscale(1)}
.build-item.locked::after{content:'🔒';position:absolute;top:2px;right:4px;font-size:12px}
.build-item.required{border-color:#ff8800;box-shadow:0 0 12px rgba(255,136,0,.6);animation:reqPulse 1.5s infinite}
@keyframes reqPulse{0%,100%{box-shadow:0 0 12px rgba(255,136,0,.6)}50%{box-shadow:0 0 20px rgba(255,136,0,1)}}
.build-icon{font-size:24px;margin-bottom:3px}
.build-name{font-size:9px;color:#c9a961;text-align:center;text-transform:uppercase;letter-spacing:1px}
.build-cost{font-size:8px;color:#8b6914;margin-top:1px;line-height:1.2}

.minimap{position:absolute;top:10px;right:10px;width:160px;height:160px;background:rgba(10,6,3,.9);border:2px solid #8b6914;border-radius:4px;box-shadow:0 0 15px rgba(0,0,0,.8)}
.minimap canvas{width:100%;height:100%}

.interact-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(42,31,21,.95);border:2px solid #8b6914;padding:10px 20px;color:#c9a961;font-size:13px;text-align:center;pointer-events:none;box-shadow:0 0 15px rgba(139,105,20,.5)}

.message-log{position:absolute;left:10px;bottom:130px;width:320px;max-height:180px;overflow:hidden;pointer-events:none}
.message{background:rgba(26,18,8,.9);border-left:3px solid #8b6914;padding:5px 10px;margin:3px 0;font-size:11px;color:#c9a961;animation:fadeIn .3s ease}
.message.danger{border-left-color:#c94a4a;color:#c94a4a}
.message.success{border-left-color:#4ac94a;color:#4ac94a}
.message.info{border-left-color:#4a8aca;color:#4a8aca}
.message.tutorial{border-left-color:#ff8800;color:#ffaa44;font-weight:bold}
@keyframes fadeIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

.progress-bar{position:absolute;bottom:190px;left:50%;transform:translateX(-50%);width:200px;pointer-events:none}
.progress-label{font-size:11px;color:#c9a961;text-align:center;margin-bottom:3px;text-transform:uppercase;letter-spacing:2px}
.progress-fill{height:16px;background:#0a0603;border:2px solid #8b6914;position:relative}
.progress-bar-inner{height:100%;background:linear-gradient(90deg,#8b6914,#c9a961);transition:width .1s linear}
.progress-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px;color:#0a0603;font-weight:bold;text-shadow:none}

/* ============ 引导面板 ============ */
.tutorial-panel{position:absolute;top:50%;left:20px;transform:translateY(-50%);width:320px;background:linear-gradient(135deg,#2a1f15,#1a1208);border:3px solid #ff8800;border-radius:6px;padding:14px;box-shadow:0 0 25px rgba(255,136,0,.5);z-index:20;pointer-events:auto}
.tutorial-panel.hidden{display:none}
.tutorial-step-num{font-size:10px;color:#ffaa44;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
.tutorial-title{font-size:16px;color:#ffdd88;margin-bottom:8px;text-shadow:1px 1px 0 #000;font-weight:bold}
.tutorial-desc{font-size:12px;color:#c9a961;line-height:1.6;margin-bottom:12px}
.tutorial-objective{background:rgba(10,6,3,.6);border:1px solid #8b6914;padding:8px;margin-bottom:10px}
.tutorial-obj-text{font-size:11px;color:#c9a961;margin-bottom:5px}
.tutorial-obj-items{font-size:10px;color:#8b6914}
.tutorial-obj-items span{display:block;margin:2px 0}
.tutorial-obj-items span.done{color:#4ac94a;text-decoration:line-through}
.tutorial-obj-items span.active{color:#ffaa44}
.tutorial-skip{background:linear-gradient(135deg,#5a3a14,#8b6914);border:1px solid #c9a961;color:#1a1208;padding:4px 12px;font-size:10px;font-family:'Courier New',monospace;cursor:pointer;letter-spacing:2px;text-transform:uppercase;float:right}
.tutorial-skip:hover{box-shadow:0 0 10px rgba(201,169,97,.6)}

/* ============ 行动提示框 ============ */
.action-hint{position:absolute;top:50%;right:20px;transform:translateY(-50%);background:rgba(42,31,21,.95);border:2px solid #ffaa44;border-radius:4px;padding:12px;max-width:280px;pointer-events:none;z-index:15;box-shadow:0 0 15px rgba(255,170,68,.4);animation:slideIn .5s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-50%) translateX(30px)}to{opacity:1;transform:translateY(-50%) translateX(0)}}
.action-hint .hint-title{font-size:12px;color:#ffaa44;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
.action-hint .hint-body{font-size:11px;color:#c9a961;line-height:1.5}
.action-hint.danger{border-color:#c94a4a;box-shadow:0 0 15px rgba(201,74,74,.4)}
.action-hint.danger .hint-title{color:#c94a4a}
.action-hint.success{border-color:#4ac94a;box-shadow:0 0 15px rgba(74,201,74,.4)}
.action-hint.success .hint-title{color:#4ac94a}

/* ============ 资源分配面板 ============ */
.resource-flow{position:absolute;top:280px;right:10px;background:linear-gradient(135deg,#2a1f15,#1a1208);border:2px solid #8b6914;padding:10px;width:200px;font-size:10px;z-index:10;pointer-events:auto;display:none}
.resource-flow h4{font-size:11px;color:#8b6914;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;text-align:center}
.resource-flow .row{display:flex;justify-content:space-between;margin:3px 0;color:#c9a961}
.resource-flow .row.need{color:#ff6644}
.resource-flow .row.have{color:#4ac94a}
.resource-flow .sep{border-top:1px dashed #5a4a2a;margin:6px 0}
.resource-flow button{width:100%;margin-top:8px;background:linear-gradient(135deg,#8b6914,#c9a961);border:none;color:#1a1208;padding:5px;font-family:inherit;font-size:10px;cursor:pointer;font-weight:bold;letter-spacing:1px}

/* ============ 开始界面 ============ */
.start-screen{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at center,#1a1208 0%,#0a0603 80%);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.game-title{font-size:56px;color:#c9a961;text-shadow:0 0 30px rgba(201,169,97,.6),2px 2px 0 #000;letter-spacing:8px;margin-bottom:10px;font-weight:bold}
.game-subtitle{font-size:14px;color:#8b6914;letter-spacing:10px;margin-bottom:40px;text-transform:uppercase}
.start-hint{font-size:14px;color:#c9a961;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ============ 胜利/失败 ============ */
.end-screen{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(10,6,3,.95);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center}
.end-title{font-size:48px;margin-bottom:20px;letter-spacing:6px}
.end-title.victory{color:#c9a961;text-shadow:0 0 40px rgba(201,169,97,.8)}
.end-title.defeat{color:#c94a4a;text-shadow:0 0 40px rgba(201,74,74,.8)}
.end-stats{color:#c9a961;font-size:14px;line-height:2;margin-bottom:30px;text-align:center}
.restart-btn{background:linear-gradient(135deg,#8b6914,#c9a961);border:2px solid #c9a961;color:#1a1208;padding:12px 40px;font-size:16px;font-family:'Courier New',monospace;cursor:pointer;letter-spacing:3px;text-transform:uppercase;font-weight:bold}
.restart-btn:hover{box-shadow:0 0 30px rgba(201,169,97,.8)}

.damage-number{position:absolute;color:#ff4444;font-size:16px;font-weight:bold;pointer-events:none;text-shadow:1px 1px 0 #000;animation:floatUp 1s forwards}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}

/* ============ 建造预览光束 ============ */
.build-range-indicator{position:absolute;pointer-events:none;border:2px dashed #ff8800;border-radius:50%;animation:rangePulse 1s infinite}
@keyframes rangePulse{0%,100%{opacity:.4}50%{opacity:.8}}

.victory-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(10,6,3,.9);border:2px solid #c9a961;padding:6px 20px;font-size:12px;color:#c9a961;text-transform:uppercase;letter-spacing:2px;z-index:10}
.victory-bar span{color:#ffdd66;font-weight:bold}

/* ============ 移动端虚拟摇杆 ============ */
.virtual-joystick{position:absolute;left:20px;bottom:20px;width:140px;height:140px;border-radius:50%;background:rgba(42,31,21,.4);border:2px solid #8b6914;z-index:30;display:none;touch-action:none;box-shadow:0 0 20px rgba(0,0,0,.6)}
.virtual-joystick.active{display:block}
.joystick-knob{position:absolute;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#c9a961 0%,#8b6914 100%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 10px rgba(201,169,97,.5)}

/* ============ 移动端触屏按键 ============ */
.mobile-buttons{position:absolute;right:15px;bottom:15px;display:none;flex-direction:column;gap:12px;z-index:30}
.mobile-buttons.active{display:flex}
.mbtn{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#3a2f1f,#2a1f15);border:2px solid #8b6914;color:#c9a961;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none;box-shadow:0 0 10px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.mbtn:active{background:linear-gradient(135deg,#5a4f2f,#4a3f1f);border-color:#ffd700;box-shadow:0 0 15px rgba(255,215,0,.7)}
.mbtn-label{position:absolute;font-size:9px;color:#8b6914;bottom:-14px;left:50%;transform:translateX(-50%);text-transform:uppercase;letter-spacing:1px}
.mbtn-row{display:flex;gap:12px;justify-content:flex-end}
.mbtn-small{width:48px;height:48px;font-size:16px}

/* ============ 响应式 / 移动端 ============ */
@media (max-width: 768px) {
    .game-title{font-size:36px;letter-spacing:4px}
    .game-subtitle{font-size:12px;letter-spacing:6px;margin-bottom:30px}

    .hud-top{flex-wrap:wrap;gap:8px}
    .stat-panel{padding:5px 10px;min-width:0;font-size:10px}
    .stat-title{font-size:9px;margin-bottom:3px}
    .stat-bar-container{height:10px;margin:2px 0}
    .stat-text{font-size:8px}

    .resources{gap:6px;max-width:100%;font-size:10px}
    .resource-item{padding:2px 5px;font-size:9px}
    .resource-icon{width:10px;height:10px;margin-right:2px}

    .minimap{width:110px;height:110px;top:auto;bottom:150px;right:10px}

    .build-menu{bottom:auto;top:50%;left:50%;transform:translate(-50%,-20%);flex-wrap:wrap;justify-content:center;gap:5px;padding:6px;max-width:92vw}
    .build-item{width:54px;height:60px}
    .build-icon{font-size:18px}
    .build-name{font-size:8px}
    .build-cost{display:none}

    .tutorial-panel{top:10px;left:10px;right:10px;transform:none;width:auto;max-height:40vh;overflow-y:auto;padding:10px}
    .tutorial-title{font-size:14px}
    .tutorial-desc{font-size:11px;line-height:1.5}

    .action-hint{top:auto;bottom:280px;right:10px;left:10px;transform:none;max-width:none}

    .message-log{left:10px;bottom:260px;width:45vw;max-height:120px}
    .message{font-size:10px;padding:3px 6px;margin:2px 0}

    .progress-bar{bottom:200px;width:160px}

    .victory-bar{font-size:10px;padding:4px 10px;letter-spacing:1px}

    .interact-hint{font-size:11px;padding:8px 14px}

    /* 移动端隐藏桌面提示 */
    body.is-mobile .hint{display:none}
}

/* 安全区域（iPhone 刘海/底部横条） */
@supports (padding: max(0px)) {
    .virtual-joystick{left: max(20px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom))}
    .mobile-buttons{right: max(15px, env(safe-area-inset-right)); bottom: max(15px, env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<div class="start-screen" id="startScreen">
    <div class="game-title">迷雾之地</div>
    <div class="game-subtitle">Foggy Dominion</div>
    <div style="color:#8b6914;font-size:12px;text-align:center;max-width:550px;line-height:2;margin-bottom:30px">
        永恒迷雾笼罩的蒸汽朋克废墟大陆。你是最后的工程师。<br>
        采集、建造、防御 —— 夺回属于人类的光明。
    </div>
    <div class="start-hint">点击任意位置开始</div>
    <div style="position:absolute;bottom:30px;color:#5a4a2a;font-size:11px;letter-spacing:2px">
        WASD 移动 | 鼠标左键 建造 | E 交互 | 空格 攻击
    </div>
</div>

<!-- HUD 顶部 -->
<div class="hud hud-top">
    <div class="stat-panel" style="position:relative">
        <div class="stat-title">工程师状态</div>
        <div style="position:relative">
            <div class="stat-bar-container"><div class="stat-bar health-bar" id="healthBar" style="width:100%"></div><span class="stat-text" id="healthText">100</span></div>
            <div class="stat-bar-container"><div class="stat-bar hunger-bar" id="hungerBar" style="width:100%"></div><span class="stat-text" id="hungerText">100</span></div>
            <div class="stat-bar-container"><div class="stat-bar sanity-bar" id="sanityBar" style="width:100%"></div><span class="stat-text" id="sanityText">100</span></div>
        </div>
    </div>

    <div class="resources" id="resourcePanel"></div>

    <div class="stat-panel" style="text-align:center;min-width:100px">
        <div class="stat-title">时刻</div>
        <div style="font-size:20px;color:#c9a961;font-weight:bold" id="dayCount">第1天</div>
        <div style="font-size:10px;color:#8b6914;margin-top:2px" id="dayPhase">白昼</div>
    </div>
</div>

<div class="victory-bar">黎明进度 <span id="lightPercent">0%</span></div>

<div class="minimap"><canvas id="minimapCanvas" width="160" height="160"></canvas></div>

<div class="message-log" id="messageLog"></div>

<div class="interact-hint" id="interactHint" style="display:none"></div>

<div class="progress-bar" id="progressBar" style="display:none">
    <div class="progress-label" id="progressLabel">建造中...</div>
    <div class="progress-fill"><div class="progress-bar-inner" id="progressInner" style="width:0%"></div><span class="progress-text" id="progressText">0%</span></div>
</div>

<!-- 引导面板 -->
<div class="tutorial-panel hidden" id="tutorialPanel">
    <button class="tutorial-skip" id="tutorialSkip">跳过</button>
    <div class="tutorial-step-num" id="tutorialStepNum">阶段 1/7</div>
    <div class="tutorial-title" id="tutorialTitle">采集资源</div>
    <div class="tutorial-desc" id="tutorialDesc"></div>
    <div class="tutorial-objective">
        <div class="tutorial-obj-text">目标：</div>
        <div class="tutorial-obj-items" id="tutorialObjectives"></div>
    </div>
</div>

<!-- 行动提示 -->
<div class="action-hint" id="actionHint" style="display:none">
    <div class="hint-title" id="actionHintTitle">提示</div>
    <div class="hint-body" id="actionHintBody"></div>
</div>

<!-- 建造菜单 -->
<div class="build-menu" id="buildMenu"></div>

<div class="end-screen" id="endScreen">
    <div class="end-title" id="endTitle">黎明降临</div>
    <div class="end-stats" id="endStats"></div>
    <button class="restart-btn" onclick="location.reload()">重新开始</button>
</div>

<!-- ============ 移动端虚拟摇杆 ============ -->
<div class="virtual-joystick" id="joystick">
    <div class="joystick-knob" id="joystickKnob"></div>
</div>

<!-- ============ 移动端触屏按键 ============ -->
<div class="mobile-buttons" id="mobileButtons">
    <div class="mbtn-row" style="gap:10px">
        <div class="mbtn mbtn-small" id="btnCamera" style="position:relative">📷<span class="mbtn-label">视角</span></div>
        <div class="mbtn" id="btnAttack" style="position:relative">⚔️<span class="mbtn-label">攻击</span></div>
    </div>
    <div class="mbtn-row" style="gap:10px">
        <div class="mbtn" id="btnInteract" style="position:relative">✋<span class="mbtn-label">交互</span></div>
        <div class="mbtn" id="btnBuild" style="position:relative">🔨<span class="mbtn-label">建造</span></div>
    </div>
</div>

<script type="module">
import * as THREE from 'three';

// =================== 游戏配置 ===================
const CONFIG = {
    MAP_SIZE: 50,
    CELL_SIZE: 2,
    FOG_REVEAL_RADIUS: 6,
    PLAYER_SPEED: 6,
    DAY_LENGTH: 150,
    THREAT_SPAWN_INTERVAL: 10,
    THREAT_SPAWN_CHANCE: 0.6,
    WIN_LIGHT_PERCENT: 0.65,
    HUNGER_RATE: 0.35,
    SANITY_RATE_DARK: 0.25,
    SANITY_RATE_LIGHT: 0.05,
    HEALTH_DAMAGE_RATE: 0.6,
    DAY_THREAT_DELAY: 30, // 开局30秒内不刷怪
    INITIAL_DEPOSIT_RADIUS: 10 // 初始资源投放半径
};

const BUILDINGS = {
    torch:    { name:'火把',   icon:'🔦', cost:{wood:2},                   lightRadius:6,  buildTime:2, hp:30,  blocksPath:false },
    lamp:     { name:'蒸汽灯', icon:'🏮', cost:{metal:3,coal:2},            lightRadius:10, buildTime:3, hp:50,  blocksPath:false },
    wall:     { name:'石墙',   icon:'🧱', cost:{stone:4,metal:2},           lightRadius:0,  buildTime:2, hp:150, blocksPath:true },
    cannon:   { name:'蒸汽炮台', icon:'💣', cost:{metal:8,stone:5,coal:3},    lightRadius:0,  buildTime:5, hp:120, blocksPath:false, damage:25, attackRange:14, attackSpeed:1.5 },
    workshop: { name:'工坊',   icon:'⚙️', cost:{wood:12,metal:8},           lightRadius:4,  buildTime:8, hp:100, blocksPath:false, gatherSpeed:2 },
    tower:    { name:'照明塔', icon:'🗼', cost:{wood:10,metal:8,stone:5},    lightRadius:18, buildTime:8, hp:200, blocksPath:false }
};

const RESOURCE_NAMES = { wood:'木材', stone:'石料', metal:'金属', coal:'煤炭', food:'食物' };

// =================== 引导阶段链 ===================
const TUTORIAL_PHASES = [
    {

// =================== 游戏状态 ===================
let scene, camera, renderer, clock;
let playerGroup;
let keys = {};
let gameState = 'menu';
let gameTime = 0;
let dayCount = 1;
let isNight = false;

// 移动端检测（UA + touch capability）
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|Opera Mini|BlackBerry/i.test(navigator.userAgent) || 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (IS_MOBILE) document.body.classList.add('is-mobile');

// 移动端输入状态
let mobileInput = {
    move: { x: 0, y: 0 },  // 摇杆归一化方向
    joystickTouchId: null,
    joystickCenter: null,
    draggingCamera: false,
    cameraTouchId: null,
    lastCameraX: 0, lastCameraY: 0
};

let mapCells = [];
let threats = [];
let buildQueue = [];
let projectiles = [];
let decorations = [];

let playerData = {
    pos: new THREE.Vector3(0, 0, 0),
    health: 100, hunger: 100, sanity: 100,
    resources: { wood: 6, stone: 0, metal: 0, coal: 0, food: 4 },
    currentBuild: null,
    attackCooldown: 0, interactTarget: null,
    workshopUsed: 0, lastEatTime: 0
};

// 引导状态
let tutorialPhase = { index: -1, active: false, data: null };

// 活动提示系统
let activeHint = null;
let hintTimer = 0;

// =================== 初始化 ===================
function init() {
    clock = new THREE.Clock();
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0603);
    scene.fog = new THREE.FogExp2(0x0a0603, 0.045);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 22, 18);
    camera.lookAt(0, 0, 0);

    // 移动端性能降级
    renderer = new THREE.WebGLRenderer({ antialias: !IS_MOBILE, powerPreference: IS_MOBILE ? 'low-power' : 'high-performance' });
    renderer.setPixelRatio(IS_MOBILE ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = !IS_MOBILE;
    renderer.shadowMap.type = IS_MOBILE ? THREE.BasicShadowMap : THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // 禁用移动端双指缩放/捏合
    renderer.domElement.style.touchAction = 'none';

    scene.add(new THREE.AmbientLight(0x2a2030, 0.35));
    const sun = new THREE.DirectionalLight(0xffd4a0, 0.8);
    sun.position.set(30, 50, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.left = -60;
    sun.shadow.camera.right = 60;
    sun.shadow.camera.top = 60;
    sun.shadow.camera.bottom = -60;
    scene.add(sun);
    scene.userData.sun = sun;

    generateMap();
    placeInitialResourcesNearPlayer();
    createPlayer();
    revealArea(playerData.pos, CONFIG.FOG_REVEAL_RADIUS);
    updateLighting();
    buildMenu();

    window.addEventListener('resize', onResize);
    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (gameState === 'playing') {
            if (e.code === 'KeyB') toggleBuildMode();
            if (e.code === 'KeyE') interact();
            if (e.code === 'Space') { e.preventDefault(); attack(); }
        }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);
    renderer.domElement.addEventListener('click', onMouseClick);

    // ============ 移动端触摸控制 ============
    if (IS_MOBILE) initMobileControls();

    startGame();
    animate();
}

function initMobileControls() {
    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('joystickKnob');
    const btnAttack = document.getElementById('btnAttack');
    const btnInteract = document.getElementById('btnInteract');
    const btnBuild = document.getElementById('btnBuild');
    const btnCamera = document.getElementById('btnCamera');

    // 显示移动端控件
    joystick.classList.add('active');
    document.getElementById('mobileButtons').classList.add('active');

    // 摇杆逻辑
    joystick.addEventListener('touchstart', e => {
        e.preventDefault();
        const t = e.changedTouches[0];
        mobileInput.joystickTouchId = t.identifier;
        mobileInput.joystickCenter = { x: t.clientX, y: t.clientY };
        updateJoystick(t.clientX, t.clientY);
    }, { passive: false });

    joystick.addEventListener('touchmove', e => {
        e.preventDefault();
        for (const t of e.changedTouches) {
            if (t.identifier === mobileInput.joystickTouchId) {
                updateJoystick(t.clientX, t.clientY);
            }
        }
    }, { passive: false });

    const resetJoystick = e => {
        e.preventDefault();
        for (const t of e.changedTouches) {
            if (t.identifier === mobileInput.joystickTouchId) {
                mobileInput.joystickTouchId = null;
                mobileInput.move.x = 0;
                mobileInput.move.y = 0;
                knob.style.transform = 'translate(-50%,-50%)';
            }
        }
    };
    joystick.addEventListener('touchend', resetJoystick, { passive: false });
    joystick.addEventListener('touchcancel', resetJoystick, { passive: false });

    function updateJoystick(x, y) {
        const center = mobileInput.joystickCenter;
        const dx = x - center.x;
        const dy = y - center.y;
        const maxRadius = 50;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const clamped = Math.min(dist, maxRadius);
        const angle = Math.atan2(dy, dx);
        const nx = Math.cos(angle) * (clamped / maxRadius);
        const ny = Math.sin(angle) * (clamped / maxRadius);
        mobileInput.move.x = nx;
        mobileInput.move.y = ny;
        // UI knob 位置
        knob.style.transform = `translate(calc(-50% + ${nx*maxRadius}px), calc(-50% + ${ny*maxRadius}px))`;
    }

    // 画面空白处触摸 → 建造放置 OR 视角控制（可选）
    // 这里用"长按画面=建造放置"的逻辑复用 onMouseClick

    // 攻击按钮
    btnAttack.addEventListener('touchstart', e => { e.preventDefault(); if (gameState==='playing') attack(); }, { passive: false });
    // 交互按钮
    btnInteract.addEventListener('touchstart', e => { e.preventDefault(); if (gameState==='playing') interact(); }, { passive: false });
    // 建造按钮 - 循环切换类型
    btnBuild.addEventListener('touchstart', e => {
        e.preventDefault();
        if (gameState!=='playing') return;
        const types = ['torch','lamp','wall','cannon','workshop','tower'];
        const idx = playerData.currentBuild ? types.indexOf(playerData.currentBuild) : -1;
        playerData.currentBuild = types[(idx+1) % types.length];
        showMessage(`建造: ${BUILDINGS[playerData.currentBuild].name}`, 'info');
        updateBuildUI();
    }, { passive: false });
    // 视角按钮 - 切换建造/视角拖拽模式（当前未使用，保留）
    btnCamera.addEventListener('touchstart', e => { e.preventDefault(); }, { passive: false });

    // 画面点击 → 建造放置（触屏单次 tap）
    let touchStartPos = null;
    renderer.domElement.addEventListener('touchstart', e => {
        if (gameState!=='playing') return;
        if (mobileInput.joystickTouchId !== null) return; // 摇杆触控忽略
        touchStartPos = e.changedTouches[0];
    }, { passive: true });

    renderer.domElement.addEventListener('touchend', e => {
        if (gameState!=='playing') return;
        if (!touchStartPos) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartPos.clientX;
        const dy = t.clientY - touchStartPos.clientY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        // 如果是 tap（距离小），视为建造点击
        if (dist < 15) {
            if (playerData.currentBuild) {
                handleTouchBuild(t.clientX, t.clientY);
            }
        }
        touchStartPos = null;
    }, { passive: true });

    // 禁用移动端选择/缩放
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());
}

function handleTouchBuild(clientX, clientY) {
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(
        (clientX / window.innerWidth) * 2 - 1,
        -(clientY / window.innerHeight) * 2 + 1
    );
    raycaster.setFromCamera(mouse, camera);
    const terrain = scene.getObjectByName('terrain');
    const intersects = raycaster.intersectObjects(terrain.children);
    if (intersects.length > 0) tryBuild(playerData.currentBuild, intersects[0].point);
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// =================== 地图生成 ===================
function generateMap() {
    const size = CONFIG.MAP_SIZE;
    const cellSize = CONFIG.CELL_SIZE;
    mapCells = [];

    const terrainGroup = new THREE.Group();
    terrainGroup.name = 'terrain';
    scene.add(terrainGroup);

    for (let x = 0; x < size; x++) {
        mapCells[x] = [];
        for (let z = 0; z < size; z++) {
            const nx = x / 10, nz = z / 10;
            const noise = Math.sin(nx*2.5)*Math.cos(nz*2.5) + Math.sin(nx*1.3+nz*0.7)*0.5 + Math.cos(nx*0.5+nz*1.5)*0.3;

            let terrain, height;
            if (noise > 0.8) { terrain='stone'; height=1.2; }
            else if (noise > 0.4) { terrain='grass'; height=0.3; }
            else if (noise > 0) { terrain='dirt'; height=0.2; }
            else if (noise > -0.3) { terrain='sand'; height=0.1; }
            else if (noise > -0.6) { terrain='ruins'; height=0.4; }
            else { terrain='water'; height=-0.5; }

            const distFromCenter = Math.sqrt((x-size/2)**2 + (z-size/2)**2);
            if (distFromCenter < 6) { terrain='grass'; height=0.3; }

            const colors = { grass:0x2a3a25, dirt:0x4a3520, stone:0x5a5a5a, water:0x1a3a4a, sand:0x6a5a3a, ruins:0x3a2a20 };
            const geo = new THREE.BoxGeometry(cellSize, Math.max(0.1, height), cellSize);
            const mat = new THREE.MeshLambertMaterial({ color: colors[terrain] });
            const cell = new THREE.Mesh(geo, mat);
            cell.position.set(x*cellSize - size*cellSize/2, height/2, z*cellSize - size*cellSize/2);
            cell.receiveShadow = true;
            terrainGroup.add(cell);

            mapCells[x][z] = {
                x, z, worldX: cell.position.x, worldZ: cell.position.z,
                terrain, height, mesh: cell,
                revealed:false, lit:false, resource:null, building:null, threat:null
            };
        }
    }

    placeMapResources();
    createFogOverlay();
}

function placeMapResources() {
    const size = CONFIG.MAP_SIZE;
    for (let x = 0; x < size; x++) {
        for (let z = 0; z < size; z++) {
            const cell = mapCells[x][z];
            const distFromCenter = Math.sqrt((x-size/2)**2 + (z-size/2)**2);
            if (distFromCenter < 7) continue;
            if (cell.terrain === 'water') continue;

            const roll = Math.random();
            let r = null;
            if (cell.terrain === 'stone') {
                if (roll < 0.35) r = { resource:'stone', color:0x8a8a8a };
                else if (roll < 0.55) r = { resource:'coal', color:0x1a1a1a };
                else if (roll < 0.7) r = { resource:'metal', color:0x9a7a5a };
            } else if (cell.terrain === 'grass' || cell.terrain === 'dirt') {
                if (roll < 0.35) r = { resource:'wood', color:0x4a3520 };
                else if (roll < 0.5) r = { resource:'food', color:0x3a5a2a };
            } else if (cell.terrain === 'ruins') {
                if (roll < 0.4) r = { resource:'metal', color:0x9a7a5a };
                else if (roll < 0.55) r = { resource:'coal', color:0x1a1a1a };
                else if (roll < 0.65) r = { resource:'wood', color:0x4a3520 };
            }

            if (r) createResourceOnCell(cell, r);
        }
    }
}

function placeInitialResourcesNearPlayer() {
    // 在玩家附近确保有资源（引导用）
    const size = CONFIG.MAP_SIZE;
    const centerX = Math.floor(size / 2);
    const centerZ = Math.floor(size / 2);
    const required = [
        // 近处木材 (采集阶段)
        {dx:3, dz:0, resource:'wood', color:0x4a3520, amount:8},
        {dx:-3, dz:0, resource:'wood', color:0x4a3520, amount:8},
        {dx:0, dz:-3, resource:'wood', color:0x4a3520, amount:8},
        // 食物
        {dx:0, dz:3, resource:'food', color:0x3a5a2a, amount:6},
        {dx:4, dz:4, resource:'food', color:0x3a5a2a, amount:5},
        // 石料 (多个点)
        {dx:5, dz:2, resource:'stone', color:0x8a8a8a, amount:6},
        {dx:-7, dz:2, resource:'stone', color:0x8a8a8a, amount:6},
        {dx:8, dz:-3, resource:'stone', color:0x8a8a8a, amount:6},
        // 金属 (多个点)
        {dx:-5, dz:-2, resource:'metal', color:0x9a7a5a, amount:5},
        {dx:5, dz:-4, resource:'metal', color:0x9a7a5a, amount:5},
        {dx:-8, dz:-4, resource:'metal', color:0x9a7a5a, amount:5},
        {dx:3, dz:-8, resource:'metal', color:0x9a7a5a, amount:5},
        // 煤炭
        {dx:-5, dz:4, resource:'coal', color:0x1a1a1a, amount:5},
        {dx:7, dz:4, resource:'coal', color:0x1a1a1a, amount:5},
        {dx:-9, dz:2, resource:'coal', color:0x1a1a1a, amount:5},
    ];

    for (const r of required) {
        const cx = centerX + r.dx, cz = centerZ + r.dz;
        if (cx < 0 || cx >= size || cz < 0 || cz >= size) continue;
        const cell = mapCells[cx][cz];
        if (cell.resource) { scene.remove(cell.resource); cell.resource = null; }
        createResourceOnCell(cell, { resource:r.resource, color:r.color }, r.amount || 5);
        cell.terrain = cell.terrain === 'water' ? 'grass' : cell.terrain;
    }
}

function createResourceOnCell(cell, resType, forcedAmount) {
    const group = new THREE.Group();
    const amt = forcedAmount || Math.floor(Math.random()*4) + 3;

    if (resType.resource === 'wood') {
        // 树
        const trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.25, 0.3, 2, 6),
            new THREE.MeshLambertMaterial({ color: 0x4a3520 })
        );
        trunk.position.y = 1;
        trunk.castShadow = true;
        group.add(trunk);
        const leaves = new THREE.Mesh(
            new THREE.ConeGeometry(1.1, 2.5, 6),
            new THREE.MeshLambertMaterial({ color: 0x3a5a2a })
        );
        leaves.position.y = 2.8;
        leaves.castShadow = true;
        group.add(leaves);
    } else if (resType.resource === 'stone') {
        const rock = new THREE.Mesh(
            new THREE.DodecahedronGeometry(0.8, 0),
            new THREE.MeshLambertMaterial({ color: resType.color, flatShading: true })
        );
        rock.scale.set(1, 0.7, 1);
        rock.castShadow = true;
        group.add(rock);
    } else if (resType.resource === 'metal') {
        const m = new THREE.Mesh(
            new THREE.DodecahedronGeometry(0.6, 0),
            new THREE.MeshLambertMaterial({ color: resType.color, flatShading: true, metalness: 0.3 })
        );
        m.castShadow = true;
        group.add(m);
        // 铜色矿脉斑点
        for (let i = 0; i < 3; i++) {
            const dot = new THREE.Mesh(
                new THREE.SphereGeometry(0.1, 4, 4),
                new THREE.MeshLambertMaterial({ color: 0xd49a3a })
            );
            dot.position.set((Math.random()-0.5), Math.random(), (Math.random()-0.5));
            group.add(dot);
        }
    } else if (resType.resource === 'coal') {
        const c = new THREE.Mesh(
            new THREE.DodecahedronGeometry(0.7, 0),
            new THREE.MeshLambertMaterial({ color: 0x1a1a1a, flatShading: true })
        );
        c.scale.set(1, 0.6, 1);
        c.castShadow = true;
        group.add(c);
        // 光泽
        for (let i = 0; i < 4; i++) {
            const shiny = new THREE.Mesh(
                new THREE.SphereGeometry(0.08, 4, 4),
                new THREE.MeshBasicMaterial({ color: 0x444444 })
            );
            shiny.position.set((Math.random()-0.5)*0.8, Math.random()*0.5, (Math.random()-0.5)*0.8);
            group.add(shiny);
        }
    } else if (resType.resource === 'food') {
        const bush = new THREE.Mesh(
            new THREE.SphereGeometry(0.55, 6, 6),
            new THREE.MeshLambertMaterial({ color: 0x4a5a2a })
        );
        bush.position.y = 0.5;
        bush.castShadow = true;
        group.add(bush);
        for (let i = 0; i < 5; i++) {
            const b = new THREE.Mesh(
                new THREE.SphereGeometry(0.12, 6, 6),
                new THREE.MeshLambertMaterial({ color: 0x8a1a1a })
            );
            b.position.set((Math.random()-0.5)*0.7, 0.5 + Math.random()*0.4, (Math.random()-0.5)*0.7);
            group.add(b);
        }
    }

    group.position.set(
        cell.worldX + (Math.random()-0.5)*1,
        cell.height,
        cell.worldZ + (Math.random()-0.5)*1
    );
    group.userData = {
        isResource: true,
        resource: resType.resource,
        amount: amt,
        cellX: cell.x,
        cellZ: cell.z
    };
    scene.add(group);
    cell.resource = group;
}

function createFogOverlay() {
    const size = CONFIG.MAP_SIZE * CONFIG.CELL_SIZE;
    const fogGeo = new THREE.PlaneGeometry(size + 4, size + 4);
    const fogCanvas = document.createElement('canvas');
    fogCanvas.width = 256; fogCanvas.height = 256;
    const fogCtx = fogCanvas.getContext('2d');
    fogCtx.fillStyle = '#000'; fogCtx.fillRect(0, 0, 256, 256);
    const fogTex = new THREE.CanvasTexture(fogCanvas);
    const fogMat = new THREE.MeshBasicMaterial({
        map: fogTex, transparent: true, depthWrite: false, side: THREE.DoubleSide,
        blending: THREE.CustomBlending, blendSrc: THREE.ZeroFactor, blendDst: THREE.OneMinusSrcAlphaFactor
    });
    const fogMesh = new THREE.Mesh(fogGeo, fogMat);
    fogMesh.rotation.x = -Math.PI / 2;
    fogMesh.position.y = 5;
    scene.add(fogMesh);
    scene.userData.fogCtx = fogCtx;
    scene.userData.fogTex = fogTex;
    scene.userData.fogMesh = fogMesh;
}

function updateFogCanvas() {
    const ctx = scene.userData.fogCtx;
    const size = CONFIG.MAP_SIZE;
    const cellSize = CONFIG.CELL_SIZE;
    const worldSize = size * cellSize;
    const scale = 256 / worldSize;

    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 256, 256);

    for (let x = 0; x < size; x++) {
        for (let z = 0; z < size; z++) {
            const cell = mapCells[x][z];
            if (cell.lit || cell.revealed) {
                const cx = (cell.worldX + worldSize/2) * scale;
                const cy = (cell.worldZ + worldSize/2) * scale;
                const cp = cellSize * scale;
                ctx.fillStyle = cell.lit ? 'rgba(255,255,255,1)' : 'rgba(100,90,70,0.35)';
                ctx.fillRect(cx - cp/2, cy - cp/2, cp, cp);
            }
        }
    }
    scene.userData.fogTex.needsUpdate = true;
}

// =================== 核心系统 ===================
function revealArea(pos, radius) {
    const size = CONFIG.MAP_SIZE;
    const cellSize = CONFIG.CELL_SIZE;
    const px = size/2 + pos.x/cellSize;
    const pz = size/2 + pos.z/cellSize;
    for (let x = Math.max(0, Math.floor(px-radius)); x < Math.min(size, Math.ceil(px+radius)); x++) {
        for (let z = Math.max(0, Math.floor(pz-radius)); z < Math.min(size, Math.ceil(pz+radius)); z++) {
            const dx = x-px, dz = z-pz;
            if (dx*dx + dz*dz < radius*radius) mapCells[x][z].revealed = true;
        }
    }
}

function updateLighting() {
    const size = CONFIG.MAP_SIZE;
    const cellSize = CONFIG.CELL_SIZE;
    for (let x = 0; x < size; x++) for (let z = 0; z < size; z++) mapCells[x][z].lit = false;

    const lights = [{ x: playerData.pos.x, z: playerData.pos.z, r: 6 }];
    scene.traverse(obj => {
        if (obj.userData.isBuilding && obj.userData.lightRadius > 0 && !obj.userData.destroyed) {
            lights.push({ x: obj.position.x, z: obj.position.z, r: obj.userData.lightRadius });
        }
    });

    for (const light of lights) {
        const lx = size/2 + light.x/cellSize;
        const lz = size/2 + light.z/cellSize;
        for (let x = Math.max(0, Math.floor(lx-light.r)); x < Math.min(size, Math.ceil(lx+light.r)); x++) {
            for (let z = Math.max(0, Math.floor(lz-light.r)); z < Math.min(size, Math.ceil(lz+light.r)); z++) {
                const dx = x-lx, dz = z-lz;
                if (Math.sqrt(dx*dx + dz*dz) < light.r/cellSize) {
                    mapCells[x][z].lit = true;
                    mapCells[x][z].revealed = true;
                }
            }
        }
    }

    updateFogCanvas();
    updateLightPercent();
}

function updateLightPercent() {
    const size = CONFIG.MAP_SIZE;
    let lit = 0, total = 0;
    for (let x = 0; x < size; x++) for (let z = 0; z < size; z++) {
        if (mapCells[x][z].terrain !== 'water') { total++; if (mapCells[x][z].lit) lit++; }
    }
    const pct = Math.round(lit/total*100);
    document.getElementById('lightPercent').textContent = pct + '%';
    if (lit/total >= CONFIG.WIN_LIGHT_PERCENT && gameState === 'playing') endGame('victory');
}

function getCellAt(wx, wz) {
    const size = CONFIG.MAP_SIZE;
    const x = Math.floor(size/2 + wx/CONFIG.CELL_SIZE);
    const z = Math.floor(size/2 + wz/CONFIG.CELL_SIZE);
    if (x<0||x>=size||z<0||z>=size) return null;
    return mapCells[x][z];
}

// =================== 建造系统 ===================
function buildMenu() {
    const menu = document.getElementById('buildMenu');
    menu.innerHTML = '';
    const types = ['torch', 'lamp', 'wall', 'cannon', 'workshop', 'tower'];
    for (const t of types) {
        const d = BUILDINGS[t];
        const costStr = Object.entries(d.cost).map(([k,v]) => v+RESOURCE_NAMES[k]).join(' ');
        const item = document.createElement('div');
        item.className = 'build-item';
        item.dataset.build = t;
        item.innerHTML = `<div class="build-icon">${d.icon}</div><div class="build-name">${d.name}</div><div class="build-cost">${costStr}</div>`;
        item.addEventListener('click', () => { if (gameState==='playing') selectBuild(t); });
        menu.appendChild(item);
    }
    updateBuildUI();
}

function updateBuildUI() {
    document.querySelectorAll('.build-item').forEach(item => {
        const t = item.dataset.build;
        const cost = BUILDINGS[t].cost;
        const canAfford = Object.entries(cost).every(([r,a]) => playerData.resources[r] >= a);
        item.classList.toggle('selected', playerData.currentBuild === t);
        item.classList.toggle('disabled', !canAfford);

        // 引导高亮：当前阶段需要的建筑
        if (tutorialPhase.active && tutorialPhase.index >= 0) {
            const phase = TUTORIAL_PHASES[tutorialPhase.index];
            if ((tutorialPhase.index === 2 && t === 'torch') ||
                (tutorialPhase.index === 4 && (t === 'wall' || t === 'cannon')) ||
                (tutorialPhase.index === 5 && t === 'workshop') ||
                (tutorialPhase.index === 6 && t === 'tower')) {
                item.classList.add('required');
            }
        } else {
            item.classList.remove('required');
        }
    });
}

function toggleBuildMode() {
    playerData.currentBuild = playerData.currentBuild ? null : 'torch';
    updateBuildUI();
    showMessage(playerData.currentBuild ? '建造模式开启 — 左键放置' : '建造模式关闭', 'info');
}

function selectBuild(type) {
    playerData.currentBuild = playerData.currentBuild === type ? null : type;
    updateBuildUI();
    if (playerData.currentBuild) showMessage(`建造: ${BUILDINGS[type].name} — 左键放置`, 'info');
}

function onMouseClick(event) {
    if (gameState !== 'playing' || !playerData.currentBuild) return;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(
        (event.clientX/window.innerWidth)*2-1,
        -(event.clientY/window.innerHeight)*2+1
    );
    raycaster.setFromCamera(mouse, camera);
    const terrain = scene.getObjectByName('terrain');
    const intersects = raycaster.intersectObjects(terrain.children);
    if (intersects.length > 0) tryBuild(playerData.currentBuild, intersects[0].point);
}

function tryBuild(type, worldPos) {
    const def = BUILDINGS[type];
    // 资源检查
    for (const [res, amt] of Object.entries(def.cost)) {
        if (playerData.resources[res] < amt) { showMessage(`${RESOURCE_NAMES[res]}不足！还需要 ${amt - playerData.resources[res]}`, 'danger'); return; }
    }
    const cell = getCellAt(worldPos.x, worldPos.z);
    if (!cell) { showMessage('无法建造', 'danger'); return; }
    if (playerData.pos.distanceTo(worldPos) > 15) { showMessage('太远了，靠近点再建', 'danger'); return; }
    if (cell.terrain === 'water') { showMessage('水上不能建造', 'danger'); return; }
    if (cell.building) { showMessage('这里已有建筑', 'danger'); return; }
    if (!cell.revealed) { showMessage('先探索这个区域', 'danger'); return; }

    // 扣资源
    for (const [res, amt] of Object.entries(def.cost)) playerData.resources[res] -= amt;

    const build = {
        type, cell,
        worldPos: new THREE.Vector3(worldPos.x, cell.height, worldPos.z),
        progress: 0, total: def.buildTime
    };
    buildQueue.push(build);

    const bm = createBuildingMesh(type, build.worldPos);
    cell.building = bm;
    bm.userData.buildProgress = build;
    bm.visible = false;
    showMessage(`开始建造 ${def.name}`, 'info');
    updateBuildUI();
}

function createBuildingMesh(type, pos) {
    const g = new THREE.Group();

        const w = new THREE.Mesh(new THREE.BoxGeometry(CONFIG.CELL_SIZE*0.9, 1.5, 0.35), mat.stone);
        w.position.y = 0.75; g.add(w);

}

// =================== 威胁系统 ===================
function spawnThreat() {
    const size = CONFIG.MAP_SIZE;
    const attempts = 20;
    for (let a = 0; a < attempts; a++) {
        const x = Math.floor(Math.random()*size);
        const z = Math.floor(Math.random()*size);
        const cell = mapCells[x][z];
        const dist = playerData.pos.distanceTo(new THREE.Vector3(cell.worldX, 0, cell.worldZ));
        if (dist > 10 && dist < 35 && !cell.lit && cell.terrain !== 'water') {
            const threat = createThreat(new THREE.Vector3(cell.worldX, cell.height, cell.worldZ));
            threats.push(threat);
            cell.threat = threat;
            return;
        }
    }
}

function createThreat(pos) {
    const g = new THREE.Group();
    const t = Math.random();

    if (t < 0.4) {
        // 暗影猎犬
        const bMat = new THREE.MeshLambertMaterial({ color: 0x1a0a1a });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 1.2), bMat);
        body.position.y = 0.4; g.add(body);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.5), bMat);
        head.position.set(0, 0.5, 0.7); g.add(head);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff2222 });
        const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), eyeMat).position.set(-0.1, 0.55, 0.95);
        const e2 = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), eyeMat).position.set(0.1, 0.55, 0.95);
        g.add(e1, e2);
        for (let i = 0; i < 4; i++) {
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.3, 0.12), bMat);
            leg.position.set(i<2?-0.3:0.3, 0.15, i%2===0?-0.4:0.4);
            g.add(leg);
        }
        g.userData = { type:'hound', speed:3, hp:40, damage:10, attackRange:1.5, attackSpeed:1.5, eyes:[e1,e2] };
    } else if (t < 0.75) {
        // 爬行暗影
        const bMat = new THREE.MeshLambertMaterial({ color: 0x0a050a });
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 8), bMat);
        body.position.y = 0.5; g.add(body);
        for (let i = 0; i < 6; i++) {
            const tent = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.5, 4), bMat);
            const ang = (i/6)*Math.PI*2;
            tent.position.set(Math.cos(ang)*0.4, 0.3, Math.sin(ang)*0.4);
            tent.rotation.x = ang;
            tent.userData.phase = i*Math.PI/3;
            g.add(tent);
        }
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4400 }));
        eye.position.y = 0.7; g.add(eye);
        g.userData = { type:'crawler', speed:2, hp:30, damage:15, attackRange:1.8, attackSpeed:2, tentacles:g.children.filter(c=>c.geometry.type==='CylinderGeometry'), eye };
    } else {
        // 大型暗影
        const bMat = new THREE.MeshLambertMaterial({ color: 0x150815 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.8, 1), bMat);
        body.position.y = 0.9; g.add(body);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), bMat);
        head.position.y = 2.1; g.add(head);
        for (let i = 0; i < 2; i++) {
            const horn = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4, 4), new THREE.MeshLambertMaterial({ color: 0x3a1a3a }));
            horn.position.set(i===0?-0.22:0.22, 2.6, 0);
            g.add(horn);
        }
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), eyeMat).position.set(-0.18, 2.2, 0.35);
        const e2 = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), eyeMat).position.set(0.18, 2.2, 0.35);
        g.add(e1, e2);
        g.userData = { type:'brute', speed:1.4, hp:100, damage:25, attackRange:2, attackSpeed:1, eyes:[e1,e2] };
    }

    g.userData.maxHp = g.userData.hp;
    g.userData.attackTimer = 0;
    g.position.copy(pos);
    g.traverse(c => { if (c.isMesh) c.castShadow = true; });
    scene.add(g);
    return g;
}

// =================== 交互 ===================
function interact() {
    if (gameState !== 'playing') return;
    const t = playerData.interactTarget;
    if (!t) return;

    if (t.userData.isResource) {
        const amount = t.userData.amount;
        const res = t.userData.resource;
        playerData.resources[res] += amount;
        scene.remove(t);
        const cell = mapCells[t.userData.cellX][t.userData.cellZ];
        cell.resource = null;
        showMessage(`+${amount} ${RESOURCE_NAMES[res]}`, 'success');

        // 引导：欢迎阶段检测移动后直接进入采集阶段
        if (tutorialPhase.active && tutorialPhase.index === 0 && !tutorialPhase.data.moved) {
            tutorialPhase.data.moved = true;
        }
    } else if (t.userData.isBuilding && t.userData.buildingType === 'workshop') {
        craftAtWorkshop();
    }
}

function craftAtWorkshop() {
    if (playerData.resources.wood >= 3 && playerData.resources.food < 20) {
        playerData.resources.wood -= 3;
        playerData.resources.food += 5;
        playerData.workshopUsed++;
        showMessage('工坊产出 +5 食物 (消耗 3 木材)', 'success');
    } else if (playerData.resources.wood < 3) {
        showMessage('工坊需要 3 木材', 'info');
    } else {
        showMessage('食物已满', 'info');
    }
    updateBuildUI();
}

function attack() {
    if (gameState !== 'playing' || playerData.attackCooldown > 0) return;
    playerData.attackCooldown = 0.5;
    let closest = null, closestDist = 2.5;
    for (const th of threats) {
        if (th.userData.hp <= 0) continue;
        const d = playerData.pos.distanceTo(th.position);
        if (d < closestDist) { closestDist = d; closest = th; }
    }
    if (closest) {
        const dmg = 20 + Math.random()*10;
        closest.userData.hp -= dmg;
        const knock = new THREE.Vector3().subVectors(closest.position, playerData.pos).normalize().multiplyScalar(0.8);
        closest.position.add(knock);
        showDamageNumber(closest.position, dmg);
        if (closest.userData.hp <= 0) {
            showMessage('击败威胁！', 'success');
            if (Math.random() < 0.5) playerData.resources.metal += 1;
            scene.remove(closest);
            const c = getCellAt(closest.position.x, closest.position.z);
            if (c) c.threat = null;
            threats = threats.filter(t => t !== closest);
        }
    }
}

function showDamageNumber(pos, dmg) {
    const v = pos.clone().y += 1;
    v.project(camera);
    const x = (v.x*0.5+0.5)*window.innerWidth;
    const y = (-v.y*0.5+0.5)*window.innerHeight;
    const el = document.createElement('div');
    el.className = 'damage-number';
    el.textContent = `-${Math.round(dmg)}`;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

// =================== 消息 ===================
function showMessage(text, type='info') {
    const log = document.getElementById('messageLog');
    const el = document.createElement('div');
    el.className = `message ${type}`;
    el.textContent = text;
    log.appendChild(el);
    while (log.children.length > 6) log.removeChild(log.firstChild);
    setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .5s'; setTimeout(()=>el.remove(), 500); }, 4000);
}

function showActionHint(title, body, type='info', duration=6) {
    const hint = document.getElementById('actionHint');
    hint.className = `action-hint ${type}`;
    document.getElementById('actionHintTitle').textContent = title;
    document.getElementById('actionHintBody').innerHTML = body;
    hint.style.display = 'block';
    activeHint = hint;
    hintTimer = duration;
}

// =================== 引导系统 ===================
function startTutorial() {
    tutorialPhase = { index: 0, active: true, data: null };
    renderTutorialPanel();
}

function renderTutorialPanel() {
    const panel = document.getElementById('tutorialPanel');
    if (!tutorialPhase.active || tutorialPhase.index < 0) { panel.classList.add('hidden'); return; }

    const phase = TUTORIAL_PHASES[tutorialPhase.index];
    document.getElementById('tutorialStepNum').textContent = `阶段 ${tutorialPhase.index+1}/${TUTORIAL_PHASES.length}`;
    document.getElementById('tutorialTitle').textContent = phase.title;
    document.getElementById('tutorialDesc').innerHTML = phase.desc;

    const objectivesEl = document.getElementById('tutorialObjectives');
    objectivesEl.innerHTML = '';
    for (const obj of phase.objectives) {
        const span = document.createElement('span');
        span.textContent = '□ ' + obj;
        objectivesEl.appendChild(span);
    }
    panel.classList.remove('hidden');
    if (phase.onEnter) phase.onEnter();
    updateBuildUI();
}

function checkTutorial() {
    if (!tutorialPhase.active || tutorialPhase.index < 0) return;
    const phase = TUTORIAL_PHASES[tutorialPhase.index];
    if (phase.check()) {
        if (phase.onComplete) phase.onComplete();
        tutorialPhase.index++;
        if (tutorialPhase.index >= TUTORIAL_PHASES.length) {
            tutorialPhase.active = false;
            document.getElementById('tutorialPanel').classList.add('hidden');
            showMessage('🎉 引导完成！自由生存吧！', 'success');
        } else {
            setTimeout(renderTutorialPanel, 800);
        }
    }
}

// =================== 更新循环 ===================
function update(dt) {
    if (gameState !== 'playing') return;
    gameTime += dt;

    updateDayNight();
    updatePlayer(dt);
    updateCamera();
    updateInteractTarget();
    updateBuilding(dt);
    updateThreats(dt);
    updateTurrets(dt);
    updatePlayerStats(dt);
    updateActionHint(dt);
    checkThreatSpawn();
    checkTutorial();
    updateHUD();
    updateMinimap();
}

function updateDayNight() {
    const progress = (gameTime % CONFIG.DAY_LENGTH) / CONFIG.DAY_LENGTH;
    const sun = scene.userData.sun;
    sun.position.x = Math.cos(progress*Math.PI*2) * 45;
    sun.position.y = Math.sin(progress*Math.PI*2) * 45;
    sun.position.z = 20;
    isNight = sun.position.y < 0;
    sun.intensity = isNight ? 0.15 : 0.8;
    dayCount = Math.floor(gameTime / CONFIG.DAY_LENGTH) + 1;
    document.getElementById('dayCount').textContent = `第${dayCount}天`;
    document.getElementById('dayPhase').textContent = isNight ? '黑夜' : '白昼';
}

function updatePlayer(dt) {
    if (playerData.attackCooldown > 0) playerData.attackCooldown -= dt;

    let dx = 0, dz = 0;
    // PC 键盘
    if (keys['KeyW']) dz -= 1;
    if (keys['KeyS']) dz += 1;
    if (keys['KeyA']) dx -= 1;
    if (keys['KeyD']) dx += 1;
    // 移动端摇杆（摇杆 y 正=向下，对应世界 +z）
    dx += mobileInput.move.x;
    dz += mobileInput.move.y;

    if (dx !== 0 || dz !== 0) {
        const len = Math.sqrt(dx*dx + dz*dz);
        dx /= len; dz /= len;

        const newX = playerData.pos.x + dx * CONFIG.PLAYER_SPEED * dt;
        const newZ = playerData.pos.z + CONFIG.PLAYER_SPEED * dt;

        const cellX = getCellAt(newX, playerData.pos.z);
        const cellZ = getCellAt(playerData.pos.x, newZ);
        const blockedX = cellX && cellX.building && BUILDINGS[cellX.building.userData.buildingType]?.blocksPath;
        const blockedZ = cellZ && cellZ.building && BUILDINGS[cellZ.building.userData.buildingType]?.blocksPath;

        const bound = CONFIG.MAP_SIZE * CONFIG.CELL_SIZE / 2 - CONFIG.CELL_SIZE;
        if (!blockedX) playerData.pos.x = Math.max(-bound, Math.min(bound, newX));
        if (!blockedZ) playerData.pos.z = Math.max(-bound, Math.min(bound, newZ));

        const cell = getCellAt(playerData.pos.x, playerData.pos.z);
        if (cell && cell.terrain !== 'water') playerData.pos.y = cell.height;

        playerGroup.rotation.y = Math.atan2(dx, dz);
        revealArea(playerData.pos, CONFIG.FOG_REVEAL_RADIUS);
        updateLighting();

        // 引导检测：第一步移动
        if (tutorialPhase.active && tutorialPhase.index === 0 && !tutorialPhase.data) tutorialPhase.data = { moved:false };
        if (tutorialPhase.active && tutorialPhase.index === 0 && !tutorialPhase.data.moved && (dx !== 0 || dz !== 0)) {
            tutorialPhase.data.moved = true;
        }
    }

    playerGroup.position.copy(playerData.pos);
    playerGroup.position.y += Math.sin(gameTime*5) * 0.04 * (dx!==0||dz!==0 ? 1 : 0);
}

function updateCamera() {
    const target = new THREE.Vector3(playerData.pos.x, 20, playerData.pos.z + 15);
    camera.position.lerp(target, 0.04);
    camera.lookAt(playerData.pos.x, 1, playerData.pos.z);
}

function updateInteractTarget() {
    let closest = null, closestDist = 3;
    scene.traverse(obj => {
        if (obj.userData.isResource) {
            const d = playerData.pos.distanceTo(obj.position);
            if (d < closestDist) { closestDist = d; closest = obj; }
        }
        if (obj.userData.isBuilding && obj.userData.buildingType === 'workshop' && !obj.userData.destroyed) {
            const d = playerData.pos.distanceTo(obj.position);
            if (d < closestDist) { closestDist = d; closest = obj; }
        }
    });
    playerData.interactTarget = closest;

    const hint = document.getElementById('interactHint');
    if (closest) {
        let text = '';
        if (closest.userData.isResource) text = `采集 ${RESOURCE_NAMES[closest.userData.resource]} (E)  ×${closest.userData.amount}`;
        else if (closest.userData.isBuilding && closest.userData.buildingType === 'workshop') text = '使用工坊 (E) — 3木材→5食物';
        hint.textContent = text;
        hint.style.display = 'block';
    } else hint.style.display = 'none';
}

function updateBuilding(dt) {
    const toRemove = [];
    for (const build of buildQueue) {
        build.progress += dt;
        const bm = build.cell.building;
        if (!bm.userData.buildingPlaceholder) {
            const ph = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.5, 0.6),
                new THREE.MeshBasicMaterial({ color: 0x8a6a3a, transparent: true, opacity: 0.5 })
            );
            ph.position.set(build.worldPos.x, build.worldPos.y + 0.25, build.worldPos.z);
            bm.userData.buildingPlaceholder = ph;
            scene.add(ph);
        }
        const frac = build.progress / build.total;
        const ph = bm.userData.buildingPlaceholder;
        ph.scale.set(0.3 + frac*0.7, frac, 0.3 + frac*0.7);
        ph.position.y = build.worldPos.y + ph.scale.y * 0.5;

        if (build.progress >= build.total) {
            bm.visible = true;
            if (ph) scene.remove(ph);
            bm.userData.buildProgress = null;
            bm.userData.lightRadius = BUILDINGS[build.type].lightRadius;
            showMessage(`${BUILDINGS[build.type].name} 建造完成！`, 'success');
            updateLighting();
            // 进入下一引导阶段检查
            checkTutorial();
            toRemove.push(build);
        }
    }
    buildQueue = buildQueue.filter(b => !toRemove.includes(b));
}

function updateThreats(dt) {
    const toRemove = [];
    for (const th of threats) {
        const ud = th.userData;
        if (ud.hp <= 0) { toRemove.push(th); continue; }

        const cell = getCellAt(th.position.x, th.position.z);
        const inLight = cell && cell.lit;

        let target = null, tPos = null, tDist = Infinity;
        const pDist = th.position.distanceTo(playerData.pos);
        if (pDist < tDist) { target = 'player'; tPos = playerData.pos; tDist = pDist; }

        scene.traverse(obj => {
            if (obj.userData.isBuilding && obj.userData.hp > 0 && !obj.userData.destroyed && BUILDINGS[obj.userData.buildingType]?.blocksPath) {
                const d = th.position.distanceTo(obj.position);
                if (d < 18 && d < tDist) { target = obj; tPos = obj.position; tDist = d; }
            }
        });

        if (tPos) {
            const dir = new THREE.Vector3().subVectors(tPos, th.position).normalize();
            const speedMul = inLight ? 0.35 : 1;
            th.position.x += dir.x * ud.speed * speedMul * dt;
            th.position.z += dir.z * ud.speed * speedMul * dt;
            th.rotation.y = Math.atan2(dir.x, dir.z);

            if (ud.tentacles) {
                ud.tentacles.forEach((t, i) => {
                    t.rotation.x = Math.sin(gameTime*4 + i*Math.PI/3) * 0.3;
                });
            }
            if (ud.eyes) {
                const flick = 0.7 + Math.sin(gameTime*20 + th.position.x) * 0.3;
                ud.eyes.forEach(e => { e.material.color.setRGB(flick, 0, 0); });
            }

            ud.attackTimer -= dt;
            if (ud.attackTimer <= 0 && tDist < ud.attackRange) {
                ud.attackTimer = 1 / ud.attackSpeed;
                if (target === 'player') {
                    playerData.health -= ud.damage;
                    showMessage(`受到 ${ud.damage} 伤害！`, 'danger');
                    showDamageNumber(playerData.pos, ud.damage);
                    if (playerData.health <= 0) endGame('defeat');
                } else {
                    target.userData.hp -= ud.damage;
                    if (target.userData.hp <= 0) {
                        target.userData.destroyed = true;
                        showMessage(`${BUILDINGS[target.userData.buildingType].name} 被摧毁！`, 'danger');
                        scene.remove(target);
                        const c = getCellAt(target.position.x, target.position.z);
                        if (c) c.building = null;
                        updateLighting();
                    }
                }
            }
        }
    }
    threats = threats.filter(t => !toRemove.includes(t));
    toRemove.forEach(t => { scene.remove(t); const c = getCellAt(t.position.x, t.position.z); if (c) c.threat = null; });
}

function updateTurrets(dt) {
    scene.traverse(obj => {
        if (obj.userData.isBuilding && obj.userData.buildingType === 'cannon' && !obj.userData.destroyed) {
            obj.userData.attackTimer = (obj.userData.attackTimer || 0) + dt;
            if (obj.userData.attackTimer > 1 / BUILDINGS.cannon.attackSpeed) {
                let target = null, targetDist = BUILDINGS.cannon.attackRange;
                for (const th of threats) {
                    if (th.userData.hp <= 0) continue;
                    const d = obj.position.distanceTo(th.position);
                    if (d < targetDist) { target = th; targetDist = d; }
                }
                if (target) {
                    const dx = target.position.x - obj.position.x;
                    const dz = target.position.z - obj.position.z;
                    if (obj.userData.turret) obj.userData.turret.rotation.y = Math.atan2(dx, dz);
                    obj.userData.attackTimer = 0;
                    shootProjectile(obj, target);
                }
            }
        }
        if (obj.userData.isBuilding && obj.userData.buildingType === 'workshop' && obj.userData.gears) {
            obj.userData.gears.children.forEach((g, i) => { g.rotation.x += dt * 2 * (1 - i*0.2); });
        }
    });

    const toRemove = [];
    for (const p of projectiles) {
        p.life += dt;
        p.position.add(p.velocity.clone().multiplyScalar(dt));
        for (const th of threats) {
            if (th.userData.hp <= 0) continue;
            if (p.position.distanceTo(th.position) < 1.2) {
                th.userData.hp -= p.damage;
                showDamageNumber(th.position, p.damage);
                toRemove.push(p);
                break;
            }
        }
        if (p.life > 3) toRemove.push(p);
    }
    projectiles = projectiles.filter(p => !toRemove.includes(p));
    toRemove.forEach(p => scene.remove(p));
}

function shootProjectile(from, target) {
    const proj = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xff6622 })
    );
    proj.position.set(from.position.x, 0.8, from.position.z);
    const dir = new THREE.Vector3().subVectors(target.position, from.position).normalize();
    proj.velocity = dir.multiplyScalar(30);
    proj.damage = BUILDINGS.cannon.damage;
    proj.life = 0;
    scene.add(proj);
    projectiles.push(proj);
}

function updatePlayerStats(dt) {
    playerData.hunger -= CONFIG.HUNGER_RATE * dt;
    if (playerData.hunger < 0) playerData.hunger = 0;
    if (playerData.hunger <= 0) playerData.health -= CONFIG.HEALTH_DAMAGE_RATE * dt;

    // 自动吃
    if (playerData.hunger < 70 && playerData.resources.food > 0 && gameTime - (playerData.lastEatTime || 0) > 4) {
        playerData.resources.food--;
        playerData.hunger = Math.min(100, playerData.hunger + 30);
        playerData.lastEatTime = gameTime;
    }

    const cell = getCellAt(playerData.pos.x, playerData.pos.z);
    if (cell && !cell.lit && isNight) {
        playerData.sanity -= CONFIG.SANITY_RATE_DARK * dt;
    } else {
        playerData.sanity += CONFIG.SANITY_RATE_LIGHT * dt;
    }
    playerData.sanity = Math.max(0, Math.min(100, playerData.sanity));
    if (playerData.sanity < 25) playerData.health -= 0.3 * dt;

    if (playerData.hunger > 40 && playerData.sanity > 40 && playerData.health < 100) {
        playerData.health += 1.5 * dt;
    }
    playerData.health = Math.max(0, Math.min(100, playerData.health));
    if (playerData.health <= 0) endGame('defeat');
}

function checkThreatSpawn() {
    if (gameTime < CONFIG.DAY_THREAT_DELAY) return;
    if (gameTime % CONFIG.THREAT_SPAWN_INTERVAL < 0.1) {
        if (Math.random() < CONFIG.THREAT_SPAWN_CHANCE) spawnThreat();
    }
}

function updateActionHint(dt) {
    if (activeHint) {
        hintTimer -= dt;
        if (hintTimer <= 0) {
            activeHint.style.display = 'none';
            activeHint = null;
        }
    }

    // 周期性行动提示（仅在非引导状态）
    if (!tutorialPhase.active && Math.floor(gameTime) % 15 === 0 && Math.random() < dt) {
        showProactiveHint();
    }
}

function showProactiveHint() {
    // 检查玩家当前缺什么
    const hasLight = countBuilt('torch') + countBuilt('lamp') + countBuilt('tower') + countBuilt('workshop') > 0;
    const hasDefense = countBuilt('cannon') > 0 || countBuilt('wall') > 0;

    if (isNight && !hasLight) {
        showActionHint('⚠️ 警告：夜晚来临', '你没有任何光源！黑暗中理智会快速下降，威胁即将出没。<br><br>立刻建造火把 🔦（2木材）！', 'danger', 10);
    } else if (threats.length >= 2 && !hasDefense) {
        showActionHint('⚠️ 警告：威胁逼近', `当前有 ${threats.length} 个威胁正在靠近你。<br><br>建造石墙 🧱 阻挡，或蒸汽炮台 💣 还击！`, 'danger', 10);
    } else if (playerData.resources.food <= 1 && playerData.hunger < 50) {
        showActionHint('⚠️ 食物告急', '你的食物快吃完了，饥饿正在伤害你。<br><br>采集浆果丛，或建造工坊加工木材成食物！', 'danger', 8);
    } else if (!hasLight) {
        showActionHint('💡 建议：建造光源', '黑暗中你只能看见脚下。<br><br>建造 🔦火把 / 🏮蒸汽灯 / 🗼照明塔 来驱散迷雾、提前发现威胁！', 'info', 8);
    } else if (playerData.resources.metal < 3 || playerData.resources.coal < 3) {
        showActionHint('📦 建议：探索采矿', '你手头的金属或煤炭不足。<br><br>带上光源，去更远的地方探索矿脉！', 'info', 6);
    }
}

function countBuilt(type) {
    let n = 0;
    scene.traverse(o => { if (o.userData.isBuilding && o.userData.buildingType === type && !o.userData.destroyed) n++; });
    return n;
}

function totalBuildingLightRadius() {
    let r = 0;
    scene.traverse(o => { if (o.userData.isBuilding && !o.userData.destroyed) r += o.userData.lightRadius || 0; });
    return r;
}

function updateHUD() {
    document.getElementById('healthBar').style.width = playerData.health + '%';
    document.getElementById('healthText').textContent = Math.round(playerData.health);
    document.getElementById('hungerBar').style.width = playerData.hunger + '%';
    document.getElementById('hungerText').textContent = Math.round(playerData.hunger);
    document.getElementById('sanityBar').style.width = playerData.sanity + '%';
    document.getElementById('sanityText').textContent = Math.round(playerData.sanity);

    const rp = document.getElementById('resourcePanel');
    rp.innerHTML = '';
    const resList = ['wood', 'stone', 'metal', 'coal', 'food'];
    for (const r of resList) {
        const el = document.createElement('div');
        el.className = 'resource-item';
        const col = { wood:'#8b6914', stone:'#666', metal:'#c9a961', coal:'#4a8aca', food:'#c94a4a' }[r];
        el.innerHTML = `<span style="display:inline-block;width:14px;height:14px;margin-right:4px;background:${col};vertical-align:middle;border:1px solid #c9a961"></span>${RESOURCE_NAMES[r]} <b>${playerData.resources[r]}</b>`;
        // 如果引导阶段需要这个资源且不够，标红
        if (tutorialPhase.active) {
            const phase = TUTORIAL_PHASES[tutorialPhase.index];
            if (phase && phase.id === 'gather_wood' && r === 'wood' && playerData.resources.wood < 4) el.classList.add('low');
            if (phase && phase.id === 'gather_more' && r !== 'food' && playerData.resources[r] < (r==='metal'?6:r==='stone'?4:4)) el.classList.add('low');
        }
        rp.appendChild(el);
    }

    // 建造进度
    const pb = document.getElementById('progressBar');
    if (buildQueue.length > 0) {
        const b = buildQueue[0];
        const frac = b.progress / b.total;
        pb.style.display = 'block';
        document.getElementById('progressLabel').textContent = `建造 ${BUILDINGS[b.type].name}`;
        document.getElementById('progressInner').style.width = (frac*100) + '%';
        document.getElementById('progressText').textContent = Math.round(frac*100) + '%';
    } else pb.style.display = 'none';

    updateBuildUI();
}

function updateMinimap() {
    const canvas = document.getElementById('minimapCanvas');
    const ctx = canvas.getContext('2d');
    const size = CONFIG.MAP_SIZE;
    const cs = canvas.width / size;

    ctx.fillStyle = '#0a0603';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let x = 0; x < size; x++) {
        for (let z = 0; z < size; z++) {
            const c = mapCells[x][z];
            const px = x*cs, py = z*cs;
            if (c.lit) {
                const col = { grass:'#4a5a35', dirt:'#6a5a35', stone:'#8a8a8a', water:'#3a6a7a', sand:'#8a7a4a', ruins:'#5a4530' };
                ctx.fillStyle = col[c.terrain] || '#555';
                ctx.fillRect(px, py, cs+1, cs+1);
                if (c.building && !c.building.userData.destroyed) {
                    ctx.fillStyle = '#ffdd66';
                    ctx.fillRect(px+cs/4, py+cs/4, cs/2, cs/2);
                }
                if (c.threat && c.threat.userData.hp > 0) {
                    ctx.fillStyle = '#ff3333';
                    ctx.fillRect(px+cs/3, py+cs/3, cs/3, cs/3);
                }
            } else if (c.revealed) {
                ctx.fillStyle = '#1e1812';
                ctx.fillRect(px, py, cs+1, cs+1);
            }
        }
    }
    const px = (size/2 + playerData.pos.x / CONFIG.CELL_SIZE) * cs;
    const py = (size/2 + playerData.pos.z / CONFIG.CELL_SIZE) * cs;
    ctx.fillStyle = '#ffaa33';
    ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ffdd66'; ctx.lineWidth = 1.5; ctx.stroke();
}

// =================== 游戏控制 ===================
function startGame() {
    // 移动端允许 touchstart 也能触发开始
    const startHandler = () => {
        document.getElementById('startScreen').style.display = 'none';
        gameState = 'playing';
        showMessage('蒸汽时代的黎明尚未到来...', 'tutorial');
        if (IS_MOBILE) {
            setTimeout(() => showMessage('👆 左下摇杆移动 · 右下按钮攻击/交互', 'info'), 500);
            setTimeout(() => showMessage('👆 画面 tap 放置建筑，🔨 按钮切换建筑类型', 'info'), 2500);
        }
        setTimeout(startTutorial, IS_MOBILE ? 3000 : 1500);

        document.getElementById('tutorialSkip').addEventListener('click', () => {
            tutorialPhase.active = false;
            document.getElementById('tutorialPanel').classList.add('hidden');
            showMessage('跳过引导，自由游戏！', 'info');
        });
    };
    document.getElementById('startScreen').addEventListener('click', startHandler);
    document.getElementById('startScreen').addEventListener('touchstart', startHandler, { once: true });
}

function endGame(result) {
    gameState = result;
    const screen = document.getElementById('endScreen');
    document.getElementById('endTitle').textContent = result === 'victory' ? '黎明降临' : '黑暗吞噬';
    document.getElementById('endTitle').className = 'end-title ' + (result === 'victory' ? 'victory' : 'defeat');

    const size = CONFIG.MAP_SIZE;
    let lit = 0, total = 0;
    for (let x = 0; x < size; x++) for (let z = 0; z < size; z++) {
        if (mapCells[x][z].terrain !== 'water') { total++; if (mapCells[x][z].lit) lit++; }
    }

    document.getElementById('endStats').innerHTML = `
        存活天数：${dayCount}<br>
        点亮区域：${Math.round(lit/total*100)}%<br>
        建造建筑：${scene.children.filter(o => o.userData?.isBuilding && !o.userData.destroyed).length}<br>
        击败威胁：—<br>
        剩余资源：${Object.values(playerData.resources).reduce((a,b)=>a+b, 0)}
    `;
    screen.style.display = 'flex';
}

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(0.1, clock.getDelta());
    update(dt);
    renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
