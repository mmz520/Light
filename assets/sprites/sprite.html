<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprite Atlas Viewer — 角色动画浏览器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1d24;color:#e0d8c8;font-family:system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

#topBar{background:#23272f;border-bottom:1px solid #3a3f48;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#topBar h1{font-size:13px;color:#c9a961;letter-spacing:2px;margin-right:12px;white-space:nowrap}
#topBar input[type=text]{flex:1;max-width:480px;padding:6px 10px;background:#1a1d24;border:1px solid #3a3f48;border-radius:4px;color:#e0d8c8;font-size:12px;font-family:monospace}
#topBar button{padding:6px 14px;background:#8b6914;border:none;border-radius:4px;color:#1a1d24;font-size:12px;font-weight:bold;cursor:pointer}
#topBar button:hover{background:#c9a961}
#topBar button.secondary{background:#3a3f48;color:#c9a961}
#topBar button.secondary:hover{background:#4a4f58}
#topBar .info{font-size:11px;color:#8b6914;margin-left:auto;font-family:monospace}
#folderInput{display:none}

/* 角色 tab 栏（多角色时显示） */
#roleBar{background:#1a1d24;border-bottom:1px solid #3a3f48;padding:0 16px;display:none;gap:2px;overflow-x:auto;flex-shrink:0}
#roleBar.show{display:flex}
.role-tab{padding:8px 16px;background:transparent;border:none;border-bottom:2px solid transparent;color:#8b6914;font-size:12px;font-family:monospace;cursor:pointer;white-space:nowrap}
.role-tab:hover{color:#c9a961}
.role-tab.active{color:#c9a961;border-bottom-color:#c9a961;background:#23272f}

#main{flex:1;display:flex;min-height:0}

/* 左侧：动画列表 */
#animList{width:320px;background:#20242c;border-right:1px solid #3a3f48;overflow-y:auto;flex-shrink:0}
#animList h3{font-size:11px;color:#8b6914;padding:10px 12px 4px;text-transform:uppercase;letter-spacing:1px;position:sticky;top:0;background:#20242c;border-bottom:1px solid #2a2e36}
.anim-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #2a2e36;transition:background .15s}
.anim-item:hover{background:#2a2e36}
.anim-item.active{background:#3a3420;border-left:3px solid #c9a961}
.anim-thumb{width:48px;height:48px;background:#2a2a30;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.anim-thumb canvas{max-width:100%;max-height:100%}
.anim-meta{flex:1;min-width:0}
.anim-name{font-size:12px;color:#e0d8c8;font-weight:bold}
.anim-sub{font-size:10px;color:#6a6258;font-family:monospace;margin-top:2px}
.anim-play{width:26px;height:26px;background:#8b6914;border:none;border-radius:3px;color:#1a1d24;font-size:11px;cursor:pointer;flex-shrink:0}
.anim-play:hover{background:#c9a961}

#emptyTip{padding:30px 16px;text-align:center;color:#5a5248;font-size:12px;line-height:1.8}
#emptyTip code{background:#1a1d24;padding:2px 6px;border-radius:3px;font-family:monospace;color:#8b6914}
#emptyTip h4{color:#c9a961;font-size:11px;margin:16px 0 8px;text-transform:uppercase;letter-spacing:1px}

/* 中间：画布区 */
#stage{flex:1;min-width:0;background:#0d0f14;display:flex;flex-direction:column}
#canvasWrap{flex:1;position:relative;overflow:auto;padding:20px;display:flex;align-items:center;justify-content:center}
canvas{box-shadow:0 0 40px rgba(0,0,0,.5);background:#2a2a30}

/* 底部控制栏 */
#controls{background:#23272f;border-top:1px solid #3a3f48;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex-shrink:0}
#controls label{font-size:12px;color:#a8a090;display:flex;align-items:center;gap:6px}
#controls input[type="range"]{width:130px;vertical-align:middle}
#controls input[type="checkbox"]{margin:0;cursor:pointer}
.play-btn{padding:6px 14px;background:#c9a961;border:none;border-radius:4px;color:#1a1d24;font-weight:bold;cursor:pointer;font-size:12px}
.play-btn:hover{background:#ffdd66}
.frame-label{font-size:12px;color:#c9a961;font-family:monospace;min-width:70px;text-align:center}
#fpsVal{font-size:12px;color:#c9a961;font-family:monospace;min-width:30px;text-align:right}
#info{font-size:11px;color:#6a5a3a;margin-left:auto;font-family:monospace}

#zoomCtl{display:flex;align-items:center;gap:6px;border-left:1px solid #3a3f48;padding-left:12px}
.zoom-btn{width:26px;height:26px;padding:0;background:#3a3f48;border:1px solid #4a4f58;border-radius:4px;color:#e0d8c8;font-size:14px;line-height:1;cursor:pointer}
.zoom-btn:hover{background:#4a4f58}
#zoomPct{font-size:12px;color:#c9a961;font-family:monospace;min-width:50px;text-align:center;cursor:pointer;user-select:none}
#zoomPct:hover{color:#ffdd66}

/* 手动区域 */
#manualPanel{background:#23272f;border-top:1px solid #3a3f48;padding:10px 16px;display:none;flex-wrap:wrap;gap:8px;align-items:center;flex-shrink:0}
#manualPanel.show{display:flex}
#manualPanel label{font-size:11px;color:#8b6914;margin-left:6px}
#manualPanel input[type=number],#manualPanel input[type=text]{width:60px;padding:4px 6px;background:#1a1d24;border:1px solid #3a3f48;border-radius:3px;color:#e0d8c8;font-size:11px;font-family:monospace}
.toggle-bar{font-size:10px;color:#6a5a3a;text-align:center;padding:4px;cursor:pointer;user-select:none;background:#1a1d2f;border-top:1px solid #3a3f48;flex-shrink:0}
.toggle-bar:hover{color:#c9a961}
</style>
</head>
<body>

<div id="topBar">
    <h1>SPRITE ANIM VIEWER</h1>
    <input type="text" id="rootDir" placeholder="输入URL或路径 (单角色目录, 或多角色父目录如 sprite_ani)">
    <button onclick="scanUrl()">扫描</button>
    <button class="secondary" onclick="document.getElementById('folderInput').click()">📁 选择本地目录</button>
    <input type="file" id="folderInput" webkitdirectory directory multiple>
    <span class="info" id="scanInfo">等待扫描</span>
</div>

<div id="roleBar"></div>

<div id="main">
    <div id="animList">
        <div id="emptyTip">
            <h4>如何使用</h4>
            <b>方式1：URL 扫描</b><br>
            输入目录 URL，如 <code>/sprite_ani/character_engineer_spanner</code>（单角色）<br>
            或 <code>/sprite_ani</code>（自动发现所有子角色）<br><br>
            <b>方式2：本地选择</b><br>
            点击上方「📁 选择本地目录」<br>
            直接选择本地 <code>sprite_ani</code> 文件夹<br><br>
            <b>目录结构要求</b><br>
            <code>character_{id}/manifest.json</code> 必须存在<br>
            <code>character_{id}/sheets/{id}_{action}_{dir}_sheet.png</code>
        </div>
    </div>

    <div id="stage">
        <div id="canvasWrap">
            <canvas id="cv" width="400" height="400"></canvas>
        </div>
        <div id="controls">
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶ 播放</button>
            <button class="play-btn" id="rowBtn" onclick="cycleRows()" title="方向切换">⊞ 方向</button>
            <span class="frame-label" id="frameLabel">帧 0 / 0</span>
            <label>速度 <input type="range" id="fpsRange" min="1" max="60" value="12"><span id="fpsVal">12</span>fps</label>
            <label><input type="checkbox" id="loopChk" checked>循环</label>
            <div id="zoomCtl">
                <button class="zoom-btn" onclick="zoomOut()" title="缩小">−</button>
                <span id="zoomPct" onclick="zoomReset()" title="点击重置">100%</span>
                <button class="zoom-btn" onclick="zoomIn()" title="放大">+</button>
            </div>
            <span id="info">未加载</span>
        </div>
        <div class="toggle-bar" onclick="document.getElementById('manualPanel').classList.toggle('show')">▼ 手动加载精灵表（展开）</div>
        <div id="manualPanel">
            <label>手动加载</label>
            <input type="text" id="manualUrl" placeholder="sheet URL">
            <button class="play-btn" onclick="manualLoad()">加载</button>
            <label>帧宽<input type="number" id="mFw" value="1024"></label>
            <label>帧高<input type="number" id="mFh" value="1024"></label>
            <label>列数<input type="number" id="mCols" value="8"></label>
            <label>行数<input type="number" id="mRows" value="1"></label>
        </div>
    </div>
</div>

<script>
// ========= 全局状态 =========
const img = new Image();
let imgLoaded = false;
let currentAnim = null;
let cfg = { fw:1024, fh:1024, cols:8, rows:1, row:0, loop:true, fps:12 };
let currentFrame = 0;
let playing = false;
let lastTick = 0;
let gridZoom = 1;
const ZOOM_MIN = 0.15, ZOOM_MAX = 10;

// 多角色状态
let roles = [];       // [{name, base, manifest, isLocal, localBase}]
let activeRole = null;

const DIRS_8 = ['S','SE','E','NE','N','NW','W','SW'];
const DIRS_LABELS = {S:'下',SE:'右下',E:'右',NE:'右上',N:'上',NW:'左上',W:'左',SW:'左下'};

// ========= 1. URL 扫描 =========
async function scanUrl(){
    const raw = document.getElementById('rootDir').value.trim();
    if(!raw){ document.getElementById('scanInfo').textContent = '请输入路径'; return; }
    const base = raw.replace(/\/+$/, '');
    document.getElementById('scanInfo').textContent = '扫描中...';

    roles = [];
    // 先试：base 本身就是角色目录
    try{
        const resp = await fetch(base + '/manifest.json');
        if(resp.ok){
            const manifest = await resp.json();
            roles.push({
                name: manifest.characterId || base.split('/').pop(),
                base, manifest, isLocal: false
            });
        } else {
            // base 不是角色目录，试着扫子目录
            const subdirs = await listDir(base);
            for(const sub of subdirs){
                try{
                    const r = await fetch(`${base}/${sub}/manifest.json`);
                    if(r.ok){
                        const manifest = await r.json();
                        roles.push({
                            name: manifest.characterId || sub,
                            base: `${base}/${sub}`,
                            manifest,
                            isLocal: false
                        });
                    }
                }catch(e){}
            }
        }
    }catch(e){
        document.getElementById('scanInfo').textContent = '扫描失败: ' + e.message;
        return;
    }

    finishScan();
}

// 解析 python http.server 返回的 HTML 目录列表
async function listDir(base){
    try{
        const resp = await fetch(base + '/');
        if(!resp.ok) return [];
        const html = await resp.text();
        const dirs = [];
        // python http.server 输出格式: <a href="dirname/">dirname/</a>
        const re = /href="([^"#?]+)\/?"/g;
        let m;
        while((m = re.exec(html)) !== null){
            const name = m[1];
            // 排除 ../ 和无扩展名的文件
            if(name === '../' || name === '') continue;
            if(!name.includes('.')) dirs.push(name);  // 纯目录无扩展名
        }
        return [...new Set(dirs)];
    }catch(e){ return []; }
}

// ========= 2. 本地目录选择 =========
document.getElementById('folderInput').addEventListener('change', async e=>{
    const files = e.target.files;
    if(!files.length) return;
    document.getElementById('scanInfo').textContent = `解析 ${files.length} 个文件...`;

    roles = [];
    // 收集所有 manifest.json
    const manifestFiles = {};  // relPath -> file
    for(const f of files){
        // webkitRelativePath: "sprite_ani/character_engineer_spanner/manifest.json"
        const rel = f.webkitRelativePath;
        if(rel && rel.endsWith('/manifest.json')){
            // 角色目录是倒数第二段
            const parts = rel.split('/');
            const roleDir = parts.slice(0, -1).join('/');  // 去掉 manifest.json
            manifestFiles[roleDir] = f;
        }
    }

    for(const [roleDir, file] of Object.entries(manifestFiles)){
        try{
            const text = await file.text();
            const manifest = JSON.parse(text);
            roles.push({
                name: manifest.characterId || roleDir.split('/').pop(),
                base: roleDir,
                manifest,
                isLocal: true,
                localBase: roleDir,
                // 保存 File 对象引用，用于后续构造本地 URL
                _fileMap: {}
            });
            // 收集这个角色下所有文件的 File 对象
            for(const f of files){
                if(f.webkitRelativePath && f.webkitRelativePath.startsWith(roleDir + '/')){
                    const relPath = f.webkitRelativePath.slice(roleDir.length + 1);
                    roles[roles.length-1]._fileMap[relPath] = f;
                }
            }
        }catch(err){
            console.warn('Failed to parse manifest from', roleDir, err);
        }
    }

    document.getElementById('rootDir').value = '(本地选择) ' + (Object.keys(manifestFiles).length) + ' 个角色';
    finishScan();
});

// ========= 扫描后统一处理 =========
function finishScan(){
    if(!roles.length){
        document.getElementById('scanInfo').textContent = '未找到任何含 manifest.json 的角色目录';
        document.getElementById('roleBar').classList.remove('show');
        document.getElementById('animList').innerHTML = '<div style="padding:30px;color:#5a5248;font-size:12px;text-align:center">扫描了但没找到 manifest.json。<br>确认目录结构是 <code>角色目录/manifest.json</code>。</div>';
        return;
    }

    document.getElementById('scanInfo').textContent = `发现 ${roles.length} 个角色`;

    // 渲染角色 tabs
    const roleBar = document.getElementById('roleBar');
    if(roles.length > 1){
        roleBar.innerHTML = roles.map((r, i)=>
            `<button class="role-tab${i===0?' active':''}" data-idx="${i}">${r.name}</button>`
        ).join('');
        roleBar.classList.add('show');
        roleBar.querySelectorAll('.role-tab').forEach(t=>{
            t.addEventListener('click', ()=>{
                roleBar.querySelectorAll('.role-tab').forEach(x=>x.classList.remove('active'));
                t.classList.add('active');
                selectRole(+t.dataset.idx);
            });
        });
    } else {
        roleBar.classList.remove('show');
    }

    selectRole(0);
}

function selectRole(idx){
    activeRole = roles[idx];
    renderAnimList();
    // 自动选第一个动画
    setTimeout(()=>{
        const firstItem = document.querySelector('.anim-item');
        if(firstItem) firstItem.click();
    }, 100);
}

// ========= 构造精灵表 URL =========
function buildSheetUrl(role, action, dir){
    const id = role.manifest.characterId || role.base.split('/').pop();
    const filename = `${id}_${action}_${dir}_sheet.png`;

    if(role.isLocal){
        // 本地 File 对象 → blob URL
        const relPath = `sheets/${filename}`;
        const f = role._fileMap && role._fileMap[relPath];
        if(f) return URL.createObjectURL(f);
        return null;
    } else {
        return `${role.base}/sheets/${filename}`;
    }
}

// ========= 渲染动画列表 =========
function renderAnimList(){
    if(!activeRole){ document.getElementById('animList').innerHTML = ''; return; }
    const box = document.getElementById('animList');
    const m = activeRole.manifest;
    const allActions = {...(m.loopActions||{}), ...(m.singleActions||{})};
    const dirs = m.directions || DIRS_8;

    box.innerHTML = `<h3>${activeRole.name} — ${Object.keys(allActions).length} 个动作</h3>`;

    if(!Object.keys(allActions).length){
        box.innerHTML += '<div style="padding:20px;color:#5a5248;font-size:12px;text-align:center">manifest.json 中未声明任何动作</div>';
        return;
    }

    const groups = {};
    const discovered = [];
    for(const action in allActions){
        const info = allActions[action];
        for(const dir of dirs){
            const url = buildSheetUrl(activeRole, action, dir);
            if(!url) continue;
            discovered.push({
                action, dir,
                label: `${DIRS_LABELS[dir]||dir} · ${action}`,
                url,
                fps: info.fps || 12,
                loop: info.loop !== false,
                frames: info.frames || 8
            });
            (groups[action] = groups[action] || []).push(discovered[discovered.length-1]);
        }
    }

    if(!discovered.length){
        box.innerHTML += '<div style="padding:20px;color:#5a5248;font-size:12px;text-align:center">尝试构建精灵表 URL 但文件不存在。<br>确认 sheets/ 目录下有对应 PNG。</div>';
        return;
    }

    for(const action in groups){
        const title = document.createElement('h3');
        title.textContent = action + (m.singleActions && m.singleActions[action] ? ' · 单次' : '');
        box.appendChild(title);

        groups[action].forEach(a => {
            const el = document.createElement('div');
            el.className = 'anim-item';
            el.innerHTML = `
                <div class="anim-thumb"><canvas width="48" height="48"></canvas></div>
                <div class="anim-meta">
                    <div class="anim-name">${DIRS_LABELS[a.dir]||a.dir} · ${action}</div>
                    <div class="anim-sub">${a.frames}帧 · ${a.fps}fps · ${a.loop?'循环':'单次'}</div>
                </div>
                <button class="anim-play" title="播放">▶</button>
            `;
            const cv = el.querySelector('canvas');
            const playBtn = el.querySelector('.anim-play');
            el.addEventListener('click', ()=>selectAnim(el, a));
            playBtn.addEventListener('click', e=>{e.stopPropagation();selectAnim(el, a);togglePlay();});

            // 缩略图
            const ti = new Image();
            ti.onload = ()=>{
                const fw = ti.naturalWidth / a.frames;
                const tc = cv.getContext('2d');
                const frame = Math.min(a.frames-1, Math.floor(a.frames/2));
                tc.drawImage(ti, frame*fw, 0, fw, ti.naturalHeight, 0, 0, 48, 48);
            };
            ti.onerror = ()=>{
                cv.getContext('2d').fillStyle='#3a2a20';
                cv.getContext('2d').fillRect(0,0,48,48);
                cv.getContext('2d').fillStyle='#8b4014';
                cv.getContext('2d').font='8px monospace';
                cv.getContext('2d').fillText('?', 20, 30);
            };
            ti.src = a.url;

            box.appendChild(el);
        });
    }
}

// ========= 选择动画 =========
function selectAnim(el, a){
    document.querySelectorAll('.anim-item').forEach(n=>n.classList.remove('active'));
    if(el) el.classList.add('active');

    currentAnim = a;
    stopPlay();
    currentFrame = 0;

    cfg = { fw: 1024, fh: 1024, cols: a.frames, rows: 1, row: 0, loop: a.loop, fps: a.fps };
    document.getElementById('fpsRange').value = a.fps;
    document.getElementById('fpsVal').textContent = a.fps;
    document.getElementById('loopChk').checked = a.loop;

    loadSheet(a.url);
}

function loadSheet(url){
    img.onload = ()=>{
        imgLoaded = true;
        gridZoom = 1;
        const W = img.naturalWidth, H = img.naturalHeight;
        const cols = cfg.cols || 8;
        const rows = cfg.rows || 1;
        const fw = Math.floor(W / cols);
        const fh = Math.floor(H / rows);
        cfg.fw = fw; cfg.fh = fh; cfg.cols = cols; cfg.rows = rows;
        document.getElementById('info').textContent = `${currentAnim ? currentAnim.label : ''} ${W}×${H} · ${fw}×${fh}/帧 · ${cols}×${rows}`;
        render();
    };
    img.onerror = ()=>{
        imgLoaded = false;
        document.getElementById('info').textContent = '加载失败';
        ctx.fillStyle='#0d0f14'; ctx.fillRect(0,0,cv.width,cv.height);
        ctx.fillStyle='#a05040'; ctx.font='14px monospace'; ctx.textAlign='center';
        ctx.fillText('加载失败: ' + url.substring(0, 50), cv.width/2, cv.height/2);
    };
    img.src = url;
}

// ========= 渲染 =========
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function fitCanvas(w, h){ cv.width = Math.max(1,w); cv.height = Math.max(1,h); }

function computeFittedSize(){
    if(!imgLoaded) return [400, 400];
    const wrap = document.getElementById('canvasWrap');
    const maxW = Math.max(1, wrap.offsetWidth - 40);
    const maxH = Math.max(1, wrap.offsetHeight - 40);
    const srcW = cfg.fw, srcH = cfg.fh;
    const fitScale = Math.min(maxW/srcW, maxH/srcH, 3);
    const scale = fitScale * gridZoom;
    return [Math.max(1, Math.round(srcW*scale)), Math.max(1, Math.round(srcH*scale))];
}

function render(){
    if(!imgLoaded){
        ctx.fillStyle='#0d0f14'; ctx.fillRect(0,0,cv.width,cv.height);
        ctx.fillStyle='#6a5a3a'; ctx.font='14px monospace'; ctx.textAlign='center';
        ctx.fillText('请扫描根目录 或 手动加载精灵表', cv.width/2, cv.height/2);
        updateZoomUI(); updateFrameLabel(); return;
    }
    const [w,h] = computeFittedSize();
    fitCanvas(w, h);
    const col = Math.min(cfg.cols-1, Math.max(0, currentFrame));
    const row = Math.min(cfg.rows-1, Math.max(0, cfg.row));
    ctx.drawImage(img, col*cfg.fw, row*cfg.fh, cfg.fw, cfg.fh, 0, 0, w, h);
    updateFrameLabel(); updateZoomUI();
}

function updateFrameLabel(){
    document.getElementById('frameLabel').textContent =
        `${cfg.fps}fps | 帧 ${currentFrame+1} / ${cfg.cols}`;
}
function updateZoomUI(){
    document.getElementById('zoomPct').textContent = Math.round(gridZoom*100)+'%';
    document.getElementById('zoomPct').style.color = gridZoom===1 ? '#8b6914' : '#c9a961';
}

// ========= 播放循环 =========
function togglePlay(){
    playing = !playing;
    document.getElementById('playBtn').textContent = playing ? '⏸ 暂停' : '▶ 播放';
    if(playing){ lastTick = performance.now(); requestAnimationFrame(loop); }
}
function stopPlay(){
    playing = false;
    document.getElementById('playBtn').textContent = '▶ 播放';
}
function loop(now){
    if(!playing) return;
    const dt = now - lastTick;
    const frameMs = 1000 / cfg.fps;
    if(dt >= frameMs){
        lastTick = now;
        currentFrame++;
        if(currentFrame >= cfg.cols){
            if(cfg.loop) currentFrame = 0;
            else{ currentFrame = cfg.cols-1; stopPlay(); }
        }
        render();
    }
    requestAnimationFrame(loop);
}
function cycleRows(){
    cfg.row = (cfg.row + 1) % cfg.rows;
    render();
}

// ========= 缩放 =========
function clampZoom(z){ return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z)); }
function zoomIn(){ gridZoom = clampZoom(gridZoom*1.25); render(); }
function zoomOut(){ gridZoom = clampZoom(gridZoom/1.25); render(); }
function zoomReset(){ gridZoom = 1; render(); }

document.getElementById('canvasWrap').addEventListener('wheel', e=>{
    if(!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    gridZoom = clampZoom(e.deltaY<0 ? gridZoom*1.15 : gridZoom/1.15);
    render();
},{passive:false});

// ========= 手动加载 =========
function manualLoad(){
    const url = document.getElementById('manualUrl').value.trim();
    if(!url) return;
    cfg = {
        fw: +document.getElementById('mFw').value||1024,
        fh: +document.getElementById('mFh').value||1024,
        cols: +document.getElementById('mCols').value||8,
        rows: +document.getElementById('mRows').value||1,
        row:0, loop:true,
        fps: +document.getElementById('fpsRange').value||12
    };
    loadSheet(url);
}

// ========= 键盘 =========
document.addEventListener('keydown', e=>{
    if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
    if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
    else if(e.code==='ArrowRight'){ currentFrame=(currentFrame+1)%cfg.cols; render(); }
    else if(e.code==='ArrowLeft'){ currentFrame=(currentFrame-1+cfg.cols)%cfg.cols; render(); }
});

document.getElementById('fpsRange').addEventListener('input', ()=>{
    cfg.fps = +document.getElementById('fpsRange').value||12;
    document.getElementById('fpsVal').textContent = cfg.fps;
});
document.getElementById('loopChk').addEventListener('change', ()=>{
    cfg.loop = document.getElementById('loopChk').checked;
});
window.addEventListener('resize', render);

// ========= 初始：URL 参数 =========
window.addEventListener('load', ()=>{
    const params = new URLSearchParams(location.search);
    if(params.get('root')){
        document.getElementById('rootDir').value = params.get('root');
        scanUrl();
    }
});
</script>
</body>
</html>
